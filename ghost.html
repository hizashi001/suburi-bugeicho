<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GHOST library</title>
<style>
:root { --ai: #0f1626; --ai-2: #1b2438; --line: #2c3a58; --washi: #ece6d6; --muted: #97a0b4; --kin: #d6ab4c; --shu: #cf4a33; --moe: #6fbf8e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ai); color: var(--washi); font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 1.2rem; margin: 0; } h2 { font-size: 1rem; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .spread { justify-content: space-between; }
button, .btn, select, input[type=text] { background: var(--ai-2); color: var(--washi); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font: inherit; text-decoration: none; }
input[type=text] { width: 100%; }
button.primary { background: var(--kin); color: #1b1407; border-color: var(--kin); font-weight: 700; }
button.rec { background: var(--shu); border-color: var(--shu); font-weight: 700; }
button.mini { padding: 5px 10px; font-size: .85rem; }
button:disabled { opacity: .45; }
.small { font-size: .8rem; } .muted { color: var(--muted); }
.panel { background: var(--ai-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.stage { position: relative; width: 100%; aspect-ratio: 9 / 16; background: #05080f; border-radius: 10px; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .badge { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,.55); padding: 2px 10px; border-radius: 99px; font-size: .85rem; }
.stage .count { position: absolute; inset: 0; display: grid; place-items: center; font-size: 6rem; font-weight: 800; color: var(--kin); text-shadow: 0 4px 12px #000; pointer-events: none; }
.item { border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.item:first-child { border-top: 0; padding-top: 0; }
.tag { display: inline-block; font-size: .72rem; padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.tag.master { color: var(--kin); border-color: var(--kin); }
label.check { display: flex; gap: 8px; align-items: center; }
#errbox { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 9; background: #5c1414; color: #fff; border: 1px solid var(--shu); border-radius: 8px; padding: 8px 10px; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="errbox" hidden></div>
<script>
(function () {
  const show = (m) => { const b = document.getElementById("errbox"); if (!b) return; b.hidden = false; b.textContent = ("⚠ " + m + "\n" + b.textContent).slice(0, 1200); };
  window.addEventListener("error", (e) => show(`${e.message} (${(e.filename || "").split("/").pop()}:${e.lineno || ""})`));
  window.addEventListener("unhandledrejection", (e) => show(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
})();
</script>
<main>
  <div class="row spread"><h1 data-i18n="ghost.title"></h1><a class="btn small" href="index.html" data-i18n="common.back"></a></div>
  <p class="small muted" data-i18n="ghost.lead"></p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <span class="badge" id="badge" hidden></span>
    <div class="count" id="count" hidden></div>
  </div>
  <div class="panel">
    <h2 data-i18n="ghost.rec.title"></h2>
    <p class="small muted" data-i18n="ghost.rec.lead"></p>
    <input type="text" id="rec-name" maxlength="30">
    <div class="row"><span class="small" data-i18n="ghost.rec.length"></span><select id="rec-sec"></select>
      <label class="check small"><input type="checkbox" id="rec-master"><span data-i18n="ghost.rec.master"></span></label></div>
    <div class="row"><button class="primary" id="btn-cam" data-i18n="ghost.rec.cam"></button><button class="rec" id="btn-rec" data-i18n="ghost.rec.go" disabled></button></div>
  </div>
  <div class="panel">
    <div class="row spread"><h2 data-i18n="ghost.list.title"></h2>
      <span class="row"><button class="mini" id="btn-import" data-i18n="ghost.import"></button><input type="file" id="file" accept=".json,application/json" multiple hidden></span></div>
    <div id="list"></div>
  </div>
</main>
<script type="module">
// 影の書庫: the ghosts kept on this phone (recorded automatically in fights, or recorded here as a master's form),
// played back as a grey shadow, sent to others as a file, and read in from a file.
import { createGhostRecorder, ghostStore, ghostFile, readGhostFile, poseAt, drawGhost } from "./js/ghost.js";
const KEY = "suburi-bugeicho.v1";
let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const LANG = ["ja", "en"].includes(saved.lang) ? saved.lang : ((navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en");
document.documentElement.lang = LANG;
const getJSON = (u, fb) => fetch(u, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : fb)).catch(() => fb);
const [DICT, FALLBACK, CFG] = await Promise.all([getJSON(`lang/${LANG}.json`, {}), LANG === "ja" ? {} : getJSON("lang/ja.json", {}), getJSON("config/balance.json", {})]);
const G = CFG.ghost || { fps: 15, kataSeconds: [10, 30, 60] };
const t = (k, v = {}) => String(DICT[k] ?? FALLBACK[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("rec-name").placeholder = t("ghost.rec.namePh");
$("rec-sec").innerHTML = G.kataSeconds.map((s) => `<option value="${s}">${esc(t("ghost.sec", { n: s }))}</option>`).join("");

const cv = $("cv"), ctx = cv.getContext("2d");
function fitCanvas() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
fitCanvas(); addEventListener("resize", fitCanvas);
const box = () => ({ x: 0, y: 0, w: cv.width, h: cv.height });

// ---------- the list ----------
const fmtTime = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms / 1000) % 60)).padStart(2, "0")}`;
async function renderList() {
  const all = await ghostStore.list();
  $("list").innerHTML = all.length ? all.map((m) => {
    const what = m.kind === "kata" ? t("ghost.kind.kata") : t("ghost.kind.fight", { yokai: m.yokai ? t("mon." + m.yokai.id) : "?" });
    const res = m.result ? t("ghost.result", { time: fmtTime(m.result.timeMs), swings: m.result.swings }) : t("ghost.length", { time: fmtTime(m.durationMs || 0) });
    return `<div class="item"><div class="row spread"><b>${esc(m.name || what)}</b><span>${m.master ? `<span class="tag master">${esc(t("ghost.master"))}</span> ` : ""}${m.imported ? `<span class="tag">${esc(t("ghost.imported"))}</span>` : ""}</span></div>
      <span class="small muted">${esc(what)} ・ ${esc(res)} ・ ${esc(new Date(m.created).toLocaleString(LANG === "ja" ? "ja-JP" : "en-US"))}</span>
      <div class="row"><button class="mini" data-play="${m.id}">${esc(t("ghost.play"))}</button><button class="mini" data-star="${m.id}">${m.starred || m.master || m.kind === "kata" ? "★" : "☆"} ${esc(t("ghost.keep"))}</button>
      <button class="mini" data-export="${m.id}">${esc(t("ghost.export"))}</button><button class="mini" data-del="${m.id}">${esc(t("ghost.delete"))}</button></div></div>`;
  }).join("") : `<p class="small muted">${esc(t("ghost.none"))}</p>`;
  $("list").querySelectorAll("[data-play]").forEach((b) => (b.onclick = () => play(b.dataset.play)));
  $("list").querySelectorAll("[data-star]").forEach((b) => (b.onclick = async () => { const g = await ghostStore.get(b.dataset.star); await ghostStore.update(g.id, { starred: !g.starred }); renderList(); }));
  $("list").querySelectorAll("[data-export]").forEach((b) => (b.onclick = () => exportGhost(b.dataset.export)));
  $("list").querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { if (confirm(t("ghost.confirmDelete"))) { await ghostStore.remove(b.dataset.del); renderList(); } }));
}
async function exportGhost(id) {
  const g = await ghostStore.get(id), f = ghostFile(g);
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: t("ghost.title") }); } catch (e) { if (e.name !== "AbortError") throw e; }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("btn-import").onclick = () => $("file").click();
$("file").onchange = async () => {
  let n = 0;
  for (const f of $("file").files) {
    try { const g = await readGhostFile(f); g.imported = true; await ghostStore.save(g); n++; }
    catch { alert(t("ghost.badFile", { name: f.name })); }
  }
  $("file").value = ""; if (n) { renderList(); }
};

// ---------- playback ----------
let playing = null;
async function play(id) {
  stopCamera();
  const g = await ghostStore.get(id);
  playing = { g, t0: performance.now() };
  $("badge").hidden = false;
  requestAnimationFrame(playLoop);
}
function playLoop(now) {
  if (!playing) return;
  const { g, t0 } = playing, tt = now - t0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#05080f"; ctx.fillRect(0, 0, cv.width, cv.height);
  drawGhost(ctx, poseAt(g, tt), box(), { aspect: g.aspect || 0.75 });
  const sw = g.events.filter((e) => e[1] === "swing" && e[0] <= tt).length;
  $("badge").textContent = `${fmtTime(tt)} / ${fmtTime(g.durationMs || 0)}${g.events.length ? " ・ " + t("ghost.swings", { n: sw }) : ""}`;
  if (tt > (g.durationMs || 0) + 600) { playing = null; $("badge").hidden = true; return; }
  requestAnimationFrame(playLoop);
}

// ---------- recording a master's form (or any kata) ----------
const video = document.createElement("video"); video.playsInline = true; video.muted = true;
let stream = null, landmarker = null, lastLm = null;
const rec = createGhostRecorder({ fps: G.fps });
async function startCamera() {
  playing = null; $("btn-cam").disabled = true;
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream; await video.play();
  if (!landmarker) {
    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
    const files = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const opts = (delegate) => ({ baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate }, runningMode: "VIDEO", numPoses: 1 });
    try { landmarker = await vision.PoseLandmarker.createFromOptions(files, opts("GPU")); } catch { landmarker = await vision.PoseLandmarker.createFromOptions(files, opts("CPU")); }
  }
  $("btn-cam").hidden = true; $("btn-rec").disabled = false;
  requestAnimationFrame(camLoop);
}
function stopCamera() { if (stream) { stream.getTracks().forEach((x) => x.stop()); stream = null; $("btn-cam").hidden = false; $("btn-cam").disabled = false; $("btn-rec").disabled = true; } }
let lastDetect = 0;
function camLoop(now) {
  if (!stream) return;
  const W = cv.width, H = cv.height, vw = video.videoWidth, vh = video.videoHeight, aspect = vw / (vh || 1);
  // the camera picture, mirrored and fitted inside the stage, with the skeleton being recorded on top
  const bw = Math.min(W, H * aspect), bh = bw / aspect, ox = (W - bw) / 2, oy = (H - bh) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#05080f"; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(-1, 0, 0, 1, W, 0); ctx.globalAlpha = 0.55; ctx.drawImage(video, W - ox - bw, oy, bw, bh); ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (landmarker && now - lastDetect > 1000 / 30) {
    lastDetect = now;
    const res = landmarker.detectForVideo(video, now); lastLm = res.landmarks && res.landmarks[0];
    if (lastLm && rec.active) rec.frame(lastLm, now, aspect);
  }
  if (lastLm) {
    const pose = {}; for (const i of [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]) if ((lastLm[i].visibility ?? 1) > 0.3) pose[i] = [lastLm[i].x, lastLm[i].y];
    drawGhost(ctx, pose, box(), { aspect, color: rec.active ? "rgba(214,171,76,.8)" : "rgba(200,205,215,.7)" });
  }
  requestAnimationFrame(camLoop);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function recordKata() {
  const sec = +$("rec-sec").value;
  $("btn-rec").disabled = true;
  for (const n of [3, 2, 1]) { $("count").hidden = false; $("count").textContent = n; await wait(1000); }
  $("count").hidden = true;
  rec.start({ kind: "kata", master: $("rec-master").checked, name: $("rec-name").value.trim() || t("ghost.kind.kata") });
  const t0 = performance.now(); $("badge").hidden = false;
  const tick = setInterval(() => ($("badge").textContent = t("ghost.recording", { s: Math.max(0, sec - Math.floor((performance.now() - t0) / 1000)) })), 200);
  await wait(sec * 1000);
  clearInterval(tick); $("badge").hidden = true;
  const g = rec.stop();
  if (g) { await ghostStore.save(g); await renderList(); alert(t("ghost.saved", { name: g.name })); }
  else alert(t("ghost.nothing"));
  $("btn-rec").disabled = false;
}
$("btn-cam").onclick = () => startCamera().catch((e) => { $("btn-cam").disabled = false; throw e; });
$("btn-rec").onclick = recordKata;
renderList();
</script>
</body>
</html>
