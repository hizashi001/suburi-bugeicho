<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NINJA SAMURAI WORKOUT: GHOST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one narrow scroll column like a field notebook; the camera stage is the centrepiece, HUD laid over it. Deliberately single-theme (indigo night). */
:root {
  --ai: #131d33;        /* 藍: page */
  --ai-2: #1b2945;      /* panels */
  --ai-3: #24365a;      /* raised controls */
  --washi: #ebe5d5;     /* 和紙: text */
  --muted: #9ba6bc;
  --kin: #d6ab4c;       /* 金: accent */
  --shu: #cf4a33;       /* 朱: HP / damage (semantic) */
  --moe: #6fbf8e;       /* 萌黄: good */
  --line: rgba(235,229,213,.14);
  /* sword grading, low → high */
  --r0: #9ba6bc; --r1: #ebe5d5; --r2: #6fbf8e; --r3: #79a7e8; --r4: #d6ab4c;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ai); color: var(--washi); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 2.1rem; line-height: 1.2; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
small.gloss { display: block; font-family: var(--f-body); font-size: .62em; font-weight: 400; color: var(--muted); letter-spacing: 0; line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .14em; color: var(--muted); }
button {
  font: inherit; color: var(--washi); background: var(--ai-3); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 14px; cursor: pointer; min-height: 44px;
}
button:hover { border-color: var(--kin); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
button.primary { background: var(--kin); color: #1a1408; border-color: var(--kin); font-weight: 700; }
button.ghost { background: transparent; }
button.mini { min-height: 32px; padding: 4px 10px; font-size: .82rem; }
button:disabled { opacity: .45; cursor: not-allowed; }
button[aria-pressed="true"] { border-color: var(--kin); background: color-mix(in srgb, var(--kin) 18%, var(--ai-3)); }
input[type=number], input[type=text], select {
  font: inherit; color: var(--washi); background: var(--ai); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; min-height: 40px; max-width: 100%;
}
input[type=number] { width: 5.5em; font-variant-numeric: tabular-nums; }
input[type=text] { width: 9em; min-width: 0; }
.panel { background: var(--ai-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--kin); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Title */
.masthead { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.masthead .sub { color: var(--kin); font-family: var(--f-display); font-size: 1rem; letter-spacing: .3em; }
.status-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.status-strip > div { background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; min-width: 0; }
.status-strip b { font-size: 1.15rem; font-family: var(--f-display); overflow-wrap: anywhere; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 16px; }
.mode strong { font-family: var(--f-display); font-size: 1.25rem; }
.mode span { color: var(--muted); font-size: .88rem; }
.mode.kin { border-color: var(--kin); }
.tile-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; }
.tile-btn b { font-family: var(--f-display); font-size: 1.05rem; }
.tile-btn span { font-size: .75rem; color: var(--muted); }

/* Setup */
.slot { display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: start; padding-block: 10px; border-top: 1px dotted var(--line); }
.slot:first-child { border-top: 0; }
.slot .no { font-family: var(--f-display); font-size: 1.6rem; color: var(--kin); line-height: 1.2; text-align: center; }
.slot .fields { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.diffs { display: flex; flex-direction: column; gap: 6px; }
.diffs button { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 10px; align-items: center; text-align: left; }
.diffs button b { font-family: var(--f-display); font-size: 1.1rem; }
.diffs button span { font-size: .8rem; color: var(--muted); }
.diffs button em { font-style: normal; font-size: .8rem; color: var(--kin); }
.warn { border-left: 3px solid var(--shu); padding: 8px 12px; background: color-mix(in srgb, var(--shu) 10%, var(--ai-2)); border-radius: 0 6px 6px 0; font-size: .85rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: .88rem; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); padding-block: 2px; gap: 8px; }

/* Forms (型) */
.forms { display: flex; flex-direction: column; gap: 6px; }
.form-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; }
.form-row .info { min-width: 0; display: flex; flex-direction: column; }
.form-row .info b { font-family: var(--f-display); }
.arrow { width: 44px; height: 44px; }
.arrow.big { width: 72px; height: 72px; }

/* Map */
.monsters { display: flex; flex-direction: column; gap: 8px; }
.mon { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; }
.mon .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mon .info b { font-family: var(--f-display); font-size: 1.05rem; }
.seal {
  width: 56px; height: 56px; display: grid; place-items: center; border: 2px solid var(--shu); color: var(--shu);
  font-family: var(--f-display); font-size: 2rem; border-radius: 4px; background: color-mix(in srgb, var(--shu) 8%, transparent);
}
.seal.big { width: 64px; height: 64px; font-size: 2.4rem; }
.seal.gold { border-color: var(--kin); color: var(--kin); background: color-mix(in srgb, var(--kin) 14%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--kin) 40%, transparent); }
.seal.locked { border-color: var(--line); color: var(--muted); background: none; }
.seal.tame { border-color: var(--moe); color: var(--moe); background: color-mix(in srgb, var(--moe) 10%, transparent); }
.tag { display: inline-block; font-size: .7rem; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; line-height: 1.5; }
.tag.gold { color: var(--kin); }
.hpbar { height: 8px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--shu); transition: width .25s ease-out; }
.hpbar.lg { height: 12px; }

/* Gear & book */
.item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; background: var(--ai-2); border: 1px solid var(--line); border-left: 4px solid var(--rc, var(--r0)); border-radius: 8px; }
.item .nm { font-family: var(--f-display); font-size: 1.02rem; color: var(--rc, var(--r0)); }
.item .af { font-size: .8rem; color: var(--muted); }
.item .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.item.on { background: color-mix(in srgb, var(--kin) 10%, var(--ai-2)); }
.r0 { --rc: var(--r0); } .r1 { --rc: var(--r1); } .r2 { --rc: var(--r2); } .r3 { --rc: var(--r3); } .r4 { --rc: var(--r4); }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.book .card { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px; background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.book .card.partner { border-color: var(--kin); }
.stars { color: var(--kin); letter-spacing: .1em; font-size: .85rem; }

/* Battle */
.foe { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.foe .info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.switcher { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.switcher button { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 6px 4px; min-width: 0; }
.switcher button b { font-family: var(--f-display); font-size: 1rem; overflow-wrap: anywhere; }
.switcher button span { font-size: .75rem; color: var(--muted); }
.switcher button[aria-pressed="true"] span { color: var(--kin); }
.stage {
  position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 62vh; background: #0b1222; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line);
}
.stage.hit { animation: hitflash .5s ease-out; }
@keyframes hitflash { from { box-shadow: inset 0 0 0 999px rgba(207,74,51,.45); } to { box-shadow: inset 0 0 0 999px rgba(207,74,51,0); } }
.stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.stage video { opacity: .85; }
.stage .placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
.hud-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; gap: 8px; }
.hud-top .chips { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.combo { text-align: right; font-family: var(--f-display); text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.combo .n { font-size: 2.6rem; line-height: 1; color: var(--kin); }
.combo .m { font-size: .9rem; }
.combo .win { width: 110px; height: 5px; background: rgba(0,0,0,.45); border-radius: 3px; margin-top: 4px; margin-left: auto; overflow: hidden; }
.combo .win i { display: block; height: 100%; background: var(--kin); }
.chip { background: rgba(10,16,30,.8); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .78rem; }
.chip.ok { border-color: var(--moe); color: var(--moe); }
.chip.ng { border-color: var(--shu); color: #f0a091; }
.chip.note { border-color: var(--muted); color: var(--washi); font-size: .9rem; }
.timer { font-family: var(--f-display); font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.callout {
  position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(20,8,8,.84); border: 2px solid var(--shu); border-radius: 8px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: stretch;
}
.callout .who { font-size: .85rem; color: #f0a091; }
.callout .cue { font-family: var(--f-display); font-size: 1.9rem; line-height: 1.15; }
.callout .clock { height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
.callout .clock i { display: block; height: 100%; background: var(--shu); }
.callout .clock i.open { background: var(--moe); }
.callout .dodges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.callout .dodges button { min-height: 40px; padding: 6px; }
.callout.ok { border-color: var(--moe); }
.callout.reg { background: rgba(10,16,30,.86); border-color: var(--kin); }
.callout.reg .who { color: var(--kin); }
.callout .regrow { display: flex; gap: 12px; align-items: center; justify-content: center; }
.pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; font-family: var(--f-display);
  text-shadow: 0 3px 12px rgba(0,0,0,.85); animation: rise 1.1s ease-out forwards; white-space: nowrap;
}
.pop .d { font-size: 3rem; color: var(--washi); line-height: 1; }
.pop .t { font-size: 1rem; color: var(--kin); }
.pop.S .d { color: var(--kin); font-size: 3.6rem; }
.pop.heal .d { color: var(--moe); font-size: 2.4rem; }
.pop.dodge .d { color: var(--kin); font-size: 2.6rem; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, -30%) scale(1.15); } to { opacity: 0; transform: translate(-50%, -120%) scale(1); } }
.verdict { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,12,24,.72); text-align: center; }
.verdict > div { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 20px; }
.verdict h2 { font-size: 2.2rem; color: var(--kin); }

.lastswing { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.rank { font-family: var(--f-display); font-size: 3rem; line-height: 1; width: 1.3em; text-align: center; color: var(--muted); }
.rank.S { color: var(--kin); } .rank.A { color: var(--washi); } .rank.C { color: var(--shu); }
.bars { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: .8rem; }
.bars .b { display: grid; grid-template-columns: 4.5em 1fr 2.4em; gap: 8px; align-items: center; }
.bars .b > span:last-child { text-align: right; }
.meter { height: 6px; background: rgba(0,0,0,.35); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--washi); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: .82rem; }
.log li { display: grid; grid-template-columns: 1.6em 6.5em 1fr auto; gap: 8px; border-bottom: 1px dotted var(--line); padding-block: 3px; }
.log li .r { font-family: var(--f-display); }
.footer-note { font-size: .75rem; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ai-3); border: 1px solid var(--kin); padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); z-index: 40; }

/* Result overlay: big type because the player reads it from 2–3 m away */
.result {
  position: fixed; inset: 0; z-index: 30; overflow-y: auto; background: var(--ai);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
}
.res-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 24px 24px; }
.res-inner > * { animation: up .45s ease-out both; animation-delay: var(--d, 0s); }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.stamp {
  align-self: center; font-family: var(--f-display); font-weight: 800; font-size: 4.6rem; line-height: 1.1; color: var(--shu);
  border: 5px solid var(--shu); padding: 0 20px; border-radius: 6px; animation: stamp .55s cubic-bezier(.2,1.5,.4,1) both !important;
}
.stamp.kin { color: var(--kin); border-color: var(--kin); }
.stamp.latin { font-size: 3.2rem; letter-spacing: .06em; }
@keyframes stamp { from { opacity: 0; transform: rotate(-7deg) scale(2.4); } to { opacity: 1; transform: rotate(-7deg) scale(1); } }
.res-title { text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.res-title h2 { font-size: 1.8rem; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles > div { background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tiles b { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.2; }
.expbox { display: flex; flex-direction: column; gap: 6px; }
.expbox .hpbar i { background: var(--kin); transition: width 1.2s ease-out .6s; }
.lvup { font-family: var(--f-display); font-size: 1.5rem; color: var(--kin); text-align: center; }
.drops { display: flex; flex-direction: column; gap: 6px; }
.tame { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--moe); border-radius: 10px; background: color-mix(in srgb, var(--moe) 8%, var(--ai-2)); }
.tame.miss { border-color: var(--line); background: var(--ai-2); }
.tame b { font-family: var(--f-display); font-size: 1.25rem; }
.gest { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--ai) 30%); }
.gest button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px; }
.gest button b { font-family: var(--f-display); font-size: 1.25rem; }
.gest button span { font-size: .8rem; color: var(--muted); }
.gest .meter { width: 100%; height: 8px; }
.gest .meter i { background: var(--kin); width: 0; }
@media (prefers-reduced-motion: reduce) {
  .pop { animation: fade 1.1s linear forwards; } .stage.hit { animation: none; }
  .res-inner > *, .stamp { animation: none !important; }
  @keyframes fade { to { opacity: 0; } }
}
</style>
</head><body>

<div class="app">

  <!-- ===== Title ===== -->
  <section id="scr-title" class="app">
    <div class="masthead">
      <div class="row spread"><span class="sub" data-i18n="title.kicker"></span><button class="ghost mini" id="lang-btn" data-i18n="lang.switch"></button></div>
      <h1 data-i18n="app.name"></h1>
      <p class="muted" data-i18n="title.lead"></p>
    </div>
    <div class="status-strip">
      <div><span class="label" data-i18n="common.lv"></span><b class="num" id="t-lv">1</b></div>
      <div><span class="label" data-i18n="title.weapon"></span><b id="t-wp"></b></div>
      <div><span class="label" data-i18n="title.diff"></span><b id="t-diff"></b></div>
    </div>
    <p class="warn" id="t-formnote" data-i18n="title.formnote" hidden></p>
    <button class="mode kin" id="go-adv"><strong data-i18n="mode.adv"></strong><span data-i18n="mode.adv.desc"></span></button>
    <button class="mode" id="go-musha"><strong data-i18n="mode.musha"></strong><span data-i18n="mode.musha.desc"></span></button>
    <div class="grid2">
      <button class="tile-btn" id="go-forms"><b data-i18n="menu.forms"></b><span data-i18n="menu.forms.desc"></span></button>
      <button class="tile-btn" id="go-setup"><b data-i18n="menu.setup"></b><span data-i18n="menu.setup.desc"></span></button>
      <button class="tile-btn" id="go-gear"><b data-i18n="menu.gear"></b><span id="t-gear"></span></button>
      <button class="tile-btn" id="go-book"><b data-i18n="menu.book"></b><span id="t-book"></span></button>
    </div>
  </section>

  <!-- ===== Setup ===== -->
  <section id="scr-setup" class="app" hidden>
    <div class="row spread"><h2 data-i18n="menu.setup"></h2><button class="ghost" data-back="title" data-i18n="common.back"></button></div>
    <div class="panel">
      <span class="label" data-i18n="setup.diff.label"></span>
      <div class="diffs" id="diffs"></div>
      <span class="small muted" data-i18n="setup.diff.note"></span>
    </div>
    <div class="panel">
      <span class="label" data-i18n="setup.slots.label"></span>
      <div id="slots"></div>
    </div>
    <div class="panel">
      <div class="row">
        <label for="in-h" data-i18n="setup.height"></label>
        <input type="number" id="in-h" min="120" max="220" step="1"> <span>cm</span>
      </div>
      <span class="small muted" data-i18n="setup.height.note"></span>
      <label class="check" for="in-atk"><input type="checkbox" id="in-atk"><span><span data-i18n="setup.atk"></span><br><span class="small muted" data-i18n="setup.atk.note"></span></span></label>
      <div class="row"><span data-i18n="setup.freq"></span><div class="row" id="freqs" style="gap:6px"></div></div>
    </div>
    <div class="panel">
      <span class="label" data-i18n="setup.stats.label"></span>
      <div class="stats" id="wp-stats"></div>
    </div>
    <p class="warn" data-i18n="setup.safety"></p>
    <button class="primary" data-back="title" data-i18n="common.done"></button>
  </section>

  <!-- ===== Forms ===== -->
  <section id="scr-forms" class="app" hidden>

<script type="module">
// ---------- language files ----------
// Every on-screen string lives in lang/<code>.json. Names of forms, yokai and grades stay in romaji in other languages, with a small gloss.
const LANGS = ["ja", "en"];
const KEY = "suburi-bugeicho.v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const LANG = LANGS.includes(saved.lang) ? saved.lang : ((navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en");
async function loadDict(code) {
  try { const r = await fetch(`lang/${code}.json`, { cache: "no-cache" }); if (r.ok) return await r.json(); } catch {}
  return {};
}
const [DICT, FALLBACK] = await Promise.all([loadDict(LANG), LANG === "ja" ? Promise.resolve({}) : loadDict("ja")]);
const LOCALE = LANG === "ja" ? "ja-JP" : "en-US";
// t("key", {n: 3}) → the string with {n} filled in; falls back to Japanese, then to the key itself
function t(key, vars) {
  let s = DICT[key] ?? FALLBACK[key] ?? key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  return s;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// a name with its small gloss underneath, when this language has one (e.g. KESA-GIRI / Diagonal cut)
const nameHtml = (key) => { const g = DICT[key + ".gloss"]; return esc(t(key)) + (g ? `<small class="gloss">${esc(g)}</small>` : ""); };
document.documentElement.lang = LANG;
function applyStatic(root = document) {
  root.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  root.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));
  root.querySelectorAll("[data-i18n-title]").forEach((el) => (el.title = t(el.dataset.i18nTitle)));
}
applyStatic();

// ---------- data ----------
const PRESETS = [
  { id: "tanto",  kg: 0.3 },
  { id: "bokuto", kg: 0.6 },
  { id: "katana", kg: 1.2 },
  { id: "mace",   kg: 4.0 },
  { id: "buster", kg: 6.0 },
];
// Directions are in the player's frame as seen in the mirrored preview: [right, down, toward camera]
const S2 = Math.SQRT1_2;
const TYPES = [
  { id: "shinmen",      dir: [0, 1, 0],     amp: 1.0 },
  { id: "kiriage",      dir: [0, -1, 0],    amp: 0.8 },
  { id: "kesa",         dir: [-S2, S2, 0],  amp: 1.0 },
  { id: "gyakukesa",    dir: [S2, S2, 0],   amp: 1.0 },
  { id: "kesaage",      dir: [S2, -S2, 0],  amp: 0.85 },
  { id: "gyakukesaage", dir: [-S2, -S2, 0], amp: 0.85 },
  { id: "do",           dir: [-1, 0, 0],    amp: 0.9 },
  { id: "gyakudo",      dir: [1, 0, 0],     amp: 0.9 },
  { id: "tsuki",        dir: [0, 0, 1],     amp: 0.4 },
];
const TYPE = Object.fromEntries(TYPES.map((x) => [x.id, x]));
const typeName = (id) => t("type." + id);
// speed = min share of your registered peak; ang = max degrees off; wob/dip = allowed excess over your registered blur/slow-down; amp = min share of registered reach
const DIFF = [
  { speed: .45, ang: 45, wob: .40, dip: .60, amp: .40, bonus: 1.0 },
  { speed: .60, ang: 35, wob: .30, dip: .45, amp: .50, bonus: 1.1 },
  { speed: .72, ang: 27, wob: .20, dip: .30, amp: .60, bonus: 1.25 },
  { speed: .85, ang: 18, wob: .12, dip: .18, amp: .70, bonus: 1.5 },
  { speed: .95, ang: 10, wob: .05, dip: .08, amp: .80, bonus: 2.0 },
];
const diffName = (i = S.diff) => t(`diff.${i}.name`);
const FREQ = [1.6, 1, 0.7];
const MONSTERS = [
  { id: "chochin",    glyph: "灯", hp: 300,   exp: 40,   atk: 9,   weak: "shinmen",   partner: { warn: .4 } },
  { id: "kappa",      glyph: "河", hp: 1200,  exp: 120,  atk: 9,   weak: "do",        partner: { heal: .5 } },
  { id: "ittan",      glyph: "布", hp: 3000,  exp: 280,  atk: 8,   weak: "tsuki",     partner: { counter: .5 } },
  { id: "inoshishi",  glyph: "猪", hp: 6000,  exp: 520,  atk: 8,   weak: "gyakudo",   partner: { tsuki: .4 } },
  { id: "kamaitachi", glyph: "鎌", hp: 10000, exp: 850,  atk: 7,   weak: "kiriage",   partner: { combo: .3 } },
  { id: "akaoni",     glyph: "鬼", hp: 16000, exp: 1300, atk: 7,   weak: "kesa", oni: true, partner: { atk: .15 } },
  { id: "yukionna",   glyph: "雪", hp: 24000, exp: 1900, atk: 6.5, weak: "gyakukesa", partner: { atkint: .3 } },
  { id: "omukade",    glyph: "蟲", hp: 35000, exp: 2700, atk: 6,   weak: "tsuki",     partner: { combocap: 2 } },
  { id: "tsuchigumo", glyph: "蜘", hp: 50000, exp: 3800, atk: 5.5, weak: "kesaage",   partner: { drop: 1 } },
  { id: "shuten",     glyph: "酒", hp: 70000, exp: 5500, atk: 5,   weak: "shinmen", oni: true, partner: { exp: .5 } },
]; // atk = average seconds between enemy attacks
const monName = (m) => t("mon." + m.id);
const ATTACKS = ["crouch", "guard", "step"];
const SKILLS = [
  { lv: 2,  id: "fumikomi" },
  { lv: 3,  id: "rengeki" },
  { lv: 5,  id: "kaishin" },
  { lv: 7,  id: "zanshin" },
  { lv: 10, id: "onikiri" },
];
const skillName = (s) => t(`skill.${s.id}.name`), skillDesc = (s) => t(`skill.${s.id}.desc`);
const GEAR = ["tsuba", "tsuka", "omamori"];
const pctS = (v) => Math.round(v * 100) + "%";
const AFFIX = {
  atk:     { base: .05, fmt: (v) => "+" + pctS(v) },
  combo:   { base: .08, fmt: (v) => t("unit.secPlus", { v: v.toFixed(2) }) },
  counter: { base: .12, fmt: (v) => `+${v.toFixed(2)}` },
  heal:    { base: .08, fmt: (v) => "-" + pctS(v) },
  exp:     { base: .08, fmt: (v) => "+" + pctS(v) },
  crit:    { base: .10, fmt: (v) => "+" + pctS(v) },
  warn:    { base: .10, fmt: (v) => t("unit.secPlus", { v: v.toFixed(2) }) },
};
const MOD_FMT = { ...Object.fromEntries(Object.entries(AFFIX).map(([k, a]) => [k, a.fmt])),
  tsuki: (v) => "+" + pctS(v), atkint: (v) => "+" + pctS(v), combocap: (v) => "+" + v, drop: () => t("mod.drop.value") };
const modText = (k, v) => `${t("mod." + k)} ${MOD_FMT[k](v)}`;
const DAY = 24 * 3600 * 1000;
const MUSHA_SEC = 60;
const ATK_WARN = 2.6;     // seconds from warning to impact
const ATK_OPEN = 0.5;     // dodges count from this many seconds after the warning
const ATK_HEAL = 0.04;    // enemy heals this share of max HP when the attack lands
const COUNTER = 1.5;      // next swing multiplier after a clean dodge
const REG_REPS = 3;

// ---------- state (localStorage is best-effort) ----------
const fresh = () => ({
  slots: [{ name: t("preset.katana"), kg: 1.2 }, { name: t("preset.bokuto"), kg: 0.6 }, { name: t("preset.mace"), kg: 4.0 }], active: 0,
  height: 170, enemyAtk: true, freq: 1, diff: 1, forms: {}, lang: LANG,
  lv: 1, exp: 0, cleared: 0, mons: {}, best: {}, clock: 0,
  inv: [], equip: { tsuba: null, tsuka: null, omamori: null }, nextId: 1, shiki: {}, partner: null,
});
let S = { ...fresh(), ...saved };
if (!Array.isArray(S.slots) || S.slots.length !== 3) S.slots = fresh().slots;
S.equip = { ...fresh().equip, ...S.equip };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };
const now = () => Date.now() + S.clock; // S.clock = test-only time skip

const $ = (id) => document.getElementById(id);
const fmt = (n) => Math.round(n).toLocaleString(LOCALE);
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
// tiny 3-vector helpers
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scl = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len = (a) => Math.hypot(a[0], a[1], a[2]);
const norm = (a) => { const l = len(a) || 1; return scl(a, 1 / l); };
const angDeg = (a, b) => (Math.acos(Math.max(-1, Math.min(1, dot(norm(a), norm(b))))) * 180) / Math.PI;

const wp = () => S.slots[S.active];
const kg = () => wp().kg;
const diff = () => DIFF[S.diff];
const hasSkill = (id) => !musha && SKILLS.some((s) => s.id === id && S.lv >= s.lv);
const expNeed = (lv) => Math.round(100 * Math.pow(lv, 1.6));
const weightClass = (w) => (w < 1 ? "light" : w <= 2.5 ? "mid" : "heavy");
const wclassName = (w) => t("wclass." + weightClass(w));
// hand speed (m/s) of a good swing; heavier gear is expected to move slower
const expectedPeak = (w) => 6.4 / Math.sqrt(1 + 0.4 * w);
const torsoMeters = () => (S.height / 100) * 0.29; // shoulder-to-hip ≈ 29% of height

function mods() {
  const o = {};
  if (musha || reg) return o;
  const add = (m) => Object.entries(m).forEach(([k, v]) => (o[k] = (o[k] || 0) + v));
  Object.values(S.equip).forEach((id) => { const it = S.inv.find((i) => i.id === id); if (it) add(it.mods); });
  const p = MONSTERS.find((m) => m.id === S.partner);
  if (p && S.shiki[p.id]) add(p.partner);
  return o;
}
const comboWindow = (w = kg()) => 1.0 + 0.45 * w + (hasSkill("rengeki") ? 0.3 : 0) + (mods().combo || 0);
const comboCap = () => 6 + (mods().combocap || 0);
const comboMult = (c) => Math.min(comboCap(), Math.pow(1.1, Math.max(0, c - 1)));

function tmpl(x) {
  const f = S.forms[x.id];
  if (!f) return { peak: expectedPeak(kg()) * 0.85, amp: x.amp, wob: 0.15, dip: 0.15, dir: x.dir, def: true };
  return { peak: (f.peak * expectedPeak(kg())) / expectedPeak(f.kg), amp: f.amp, wob: f.wob, dip: f.dip, dir: f.dir };
}

// ---------- enemies: HP regenerates linearly, max HP per 24h ----------
const maxHp = (m, st) => m.hp * (st && st.gold ? 2 : 1);
function monState(m) {
  const st = S.mons[m.id] || (S.mons[m.id] = { hp: m.hp, at: now(), kills: 0 });
  if (st.at == null) st.at = now();
  const mx = maxHp(m, st);
  if (st.hp < mx) st.hp = Math.min(mx, st.hp + (mx * (now() - st.at)) / DAY);
  st.at = now();
  return st;
}
function regenText(m, st) {
  const mx = maxHp(m, st);
  if (st.hp >= mx) return "";
  const left = ((mx - st.hp) / mx) * DAY;
  const h = Math.floor(left / 3600000), mi = Math.floor((left % 3600000) / 60000);
  return t("regen", { rate: fmt(mx / 24), h, m: String(mi).padStart(2, "0") });
}

// ---------- screens ----------
const screens = ["title", "setup", "forms", "gear", "book", "map", "battle"];
function show(name) {
  closeResult();
  screens.forEach((s) => ($("scr-" + s).hidden = s !== name));
  if (name !== "battle") { endAttack(true); reg = null; }
  ({ title: renderTitle, setup: renderSetup, forms: renderForms, gear: renderGear, book: renderBook, map: renderMap }[name] || (() => {}))();
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", () => show(b.dataset.back)));

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (el.hidden = true), 2600);
}

// the language switch reloads the page so every screen is rebuilt in the new language
$("lang-btn").onclick = () => { S.lang = LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length]; save(); location.reload(); };

function renderTitle() {
  $("t-lv").textContent = S.lv; $("t-wp").textContent = wp().name; $("t-diff").textContent = diffName();
  $("t-formnote").hidden = Object.keys(S.forms).length > 0;
  $("t-gear").textContent = t("menu.gear.count", { n: S.inv.length });
  $("t-book").textContent = t("menu.book.count", { n: Object.keys(S.shiki).length, total: MONSTERS.length });
}

// --- setup
function renderSetup() {
  $("diffs").innerHTML = DIFF.map((d, i) => `<button data-diff="${i}" aria-pressed="${i === S.diff}"><b>${nameHtml(`diff.${i}.name`)}</b><span>${esc(t(`diff.${i}.desc`))}</span><em class="num">×${d.bonus.toFixed(2)}</em></button>`).join("");
  $("diffs").querySelectorAll("button").forEach((b) => (b.onclick = () => { S.diff = +b.dataset.diff; save(); renderSetup(); }));
  $("freqs").innerHTML = FREQ.map((f, i) => `<button class="mini" data-freq="${i}" aria-pressed="${i === S.freq}">${esc(t("freq." + i))}</button>`).join("");
  $("freqs").querySelectorAll("button").forEach((b) => (b.onclick = () => { S.freq = +b.dataset.freq; save(); renderSetup(); }));
  const box = $("slots"); box.innerHTML = "";
  S.slots.forEach((s, i) => {
    const d = document.createElement("div"); d.className = "slot";
    d.innerHTML = `<span class="no">${t("slot.no." + i)}</span>
      <div class="fields">
        <select id="sl-p${i}" aria-label="${esc(t("setup.slot.kind", { n: i + 1 }))}"><option value="">${esc(t("setup.slot.pick"))}</option>${PRESETS.map((p, j) => `<option value="${j}">${esc(t("preset.option", { name: t("preset." + p.id), kg: p.kg, sub: t("preset." + p.id + ".sub") }))}</option>`).join("")}</select>
        <input type="text" id="sl-n${i}" maxlength="10" aria-label="${esc(t("setup.slot.name", { n: i + 1 }))}" value="${esc(s.name)}">
        <span class="row" style="gap:6px"><input type="number" id="sl-k${i}" min="0.1" max="20" step="0.1" aria-label="${esc(t("setup.slot.kg", { n: i + 1 }))}" value="${s.kg}"><span>kg</span></span>
      </div>`;
    box.appendChild(d);
    d.querySelector("select").onchange = (e) => {
      const p = PRESETS[e.target.value]; if (!p) return;
      s.name = t("preset." + p.id); s.kg = p.kg; S.active = i; save(); renderSetup();
    };
    d.querySelector(`#sl-n${i}`).oninput = (e) => { s.name = e.target.value.trim() || t("setup.slot.default", { n: i + 1 }); save(); };
    d.querySelector(`#sl-k${i}`).oninput = (e) => {
      const v = parseFloat(e.target.value); if (!(v > 0)) return;
      s.kg = Math.min(20, Math.max(0.1, v)); S.active = i; save(); renderStats();
    };
  });
  $("in-h").value = S.height; $("in-atk").checked = S.enemyAtk;
  renderStats();
}
function renderStats() {
  const w = kg(), v = expectedPeak(w) * 0.85;

function arrowSvg(dir, big) {
  const cls = "arrow" + (big ? " big" : "");
  if (Math.abs(dir[2]) > 0.7) {
    return `<svg class="${cls}" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="var(--kin)" stroke-width="3"/><circle cx="20" cy="20" r="5" fill="var(--kin)"/></svg>`;
  }
  const a = (Math.atan2(dir[1], dir[0]) * 180) / Math.PI;
  return `<svg class="${cls}" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(${a.toFixed(1)} 20 20)"><line x1="5" y1="20" x2="31" y2="20" stroke="var(--kin)" stroke-width="3.5" stroke-linecap="round"/><path d="M24 12 L35 20 L24 28" fill="none" stroke="var(--kin)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;
}

function itemName(it) {

}
const affixText = (m) => Object.entries(m).map(([k, v]) => modText(k, v)).join(" ・ ");
function itemCard(it, actions = "") {

function makeItem(tier) {
  const roll = Math.random() + tier;
  const r = roll < 0.55 ? 0 : roll < 0.8 ? 1 : roll < 0.93 ? 2 : roll < 0.985 ? 3 : 4;
  const slot = pick(GEAR);
  const keys = Object.keys(AFFIX).sort(() => Math.random() - 0.5).slice(0, [1, 1, 2, 2, 3][r]);
  const m = {};
  keys.forEach((k) => (m[k] = +(AFFIX[k].base * (1 + r * 0.5) * rand(0.7, 1)).toFixed(3)));
  return { id: S.nextId++, slot, r, mods: m };
}
function addItems(items) {
  S.inv.push(...items);
  while (S.inv.length > 40) {
    const equipped = new Set(Object.values(S.equip));
    const victim = [...S.inv].filter((i) => !equipped.has(i.id)).sort((a, b) => a.r - b.r || a.id - b.id)[0];
    if (!victim) break;
    S.inv = S.inv.filter((i) => i !== victim);

}

// ---------- judging ----------
// A follow-through recovery (sword coming back the opposite way, slower) is never a cut.
function isRecovery(m) {
  return lastValid && m.tStart - lastValid.tEnd < 800 && dot(m.dir, lastValid.dir) < -0.5 && m.peak < 0.85 * lastValid.peak;
}
function judge(m) {
  let best = null;
  TYPES.forEach((x) => { const tm = tmpl(x), c = dot(m.dir, norm(tm.dir)); if (!best || c > best.c) best = { x, tm, c }; });
  const { x, tm } = best, d = diff();
  const ang = angDeg(m.dir, tm.dir), sp = m.peak / tm.peak, ampR = m.amp / tm.amp;
  const wobEx = Math.max(0, m.wob - tm.wob), dipEx = Math.max(0, m.dip - tm.dip);
  const reasons = [];
  if (sp < d.speed) reasons.push(t("why.speed", { p: Math.round(sp * 100) }));
  if (ang > d.ang) reasons.push(t("why.angle", { a: Math.round(ang) }));
  if (ampR < d.amp) reasons.push(t("why.amp"));
  if (wobEx > d.wob) reasons.push(t("why.wobble"));
  if (dipEx > d.dip) reasons.push(t("why.dip"));
  return { t: x, tm, ang, sp, ampR, wobEx, dipEx, ok: !reasons.length, reasons };
}
function onMeasure(m) {
  if ($("scr-battle").hidden || atk || resultActions) return; // swings during an enemy attack or on a result screen don't count
  if (!m.demo && isRecovery(m)) return;
  if (reg) return regSwing(m);
  const j = judge(m);
  if (!j.ok) { if (m.peak >= 0.35 * j.tm.peak) note(t("why.note", { name: typeName(j.t.id), reasons: j.reasons.join(t("list.sep2")) })); return; }
  lastValid = m;
  onSwing(m, j);
}

function onSwing(m, j) {
  if (musha && !musha.running) {
    if (musha.done) return;
    musha.running = true; musha.start = performance.now(); musha.kg = kg(); $("verdict").hidden = true; renderHeader();
  }
  if (!musha && !foe) return;
  const w = kg(), md = mods();

  // 太刀筋: direction + blur + slow-down against your registered form
  const line = 20 * clamp01(1 - j.ang / 60) + 10 * clamp01(1 - j.wobEx / 0.4) + 10 * clamp01(1 - j.dipEx / 0.5);
  const ampPts = 30 * clamp01(j.ampR);
  const zan = 30 * clamp01((1.0 - m.settle) / 0.8);
  let form = line + ampPts + zan;
  if (hasSkill("zanshin")) form = Math.min(100, form + 10);
  const speedScore = 100 * clamp01(j.sp);
  const score = Math.round(0.5 * speedScore + 0.5 * form);

  const W = cv.width, H = cv.height;
  const P = (i) => ({ x: lm[i].x * W, y: lm[i].y * H, v: lm[i].visibility ?? 1 });
  const nose = P(0), ls = P(11), rs = P(12), lh = P(23), rh = P(24), lw = P(15), rw = P(16), le = P(13), re = P(14);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const sm = mid(ls, rs), hm = mid(lh, rh), sw = Math.hypot(ls.x - rs.x, ls.y - rs.y);
  const hipsOk = lh.v > 0.4 && rh.v > 0.4;
  const T = Math.max(hipsOk ? Math.hypot(sm.x - hm.x, sm.y - hm.y) : 0, sw * 1.25);
  // freeze body scale while crouching for a dodge so the crouch itself doesn't shrink the yardstick
  if (!atk) torsoPx = torsoPx ? torsoPx * 0.9 + T * 0.1 : T;
  const vl = Math.max(0.05, lw.v), vr = Math.max(0.05, rw.v);
  const hand2 = { x: (lw.x * vl + rw.x * vr) / (vl + vr), y: (lw.y * vl + rw.y * vr) / (vl + vr) };

  // draw skeleton + sword trail (image space)
  ctx.lineWidth = Math.max(2, W / 200); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(235,229,213,.7)";
  [[ls, rs], [ls, le], [le, lw], [rs, re], [re, rw], [ls, lh], [rs, rh], [lh, rh]].forEach(([a, b]) => {
    if (a.v < 0.3 || b.v < 0.3) return; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  trail.push({ ...hand2, t: tt }); while (trail.length && tt - trail[0].t > 400) trail.shift();
  ctx.strokeStyle = "rgba(214,171,76,.95)"; ctx.lineWidth = Math.max(4, W / 90);
  ctx.beginPath(); trail.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke();

  const visible = (ls.v > 0.5 || rs.v > 0.5) && (lw.v > 0.3 || rw.v > 0.3);
  if (!visible) { gesture.update(tt, null); setChip(false); return; }

  // remote-command poses (image space; the raw camera frame shows the player's left wrist on the right)
  const T0 = torsoPx;
  const handsUp = lw.v > 0.5 && rw.v > 0.5 && lw.y < nose.y - 0.15 * T0 && rw.y < nose.y - 0.15 * T0;
  const crossed = lw.v > 0.4 && rw.v > 0.4 && lw.x < rw.x - 0.12 * T0 &&
    [lw, rw].every((p) => p.y > sm.y - 0.3 * T0 && p.y < sm.y + 0.9 * T0);
  const commanding = gesture.update(tt, handsUp ? "ok" : crossed ? "ng" : null);

  // 3D hand position in the player's frame, metres: [right, down, toward camera], hip-centred so steps and crouches don't count as cuts
  if (wl) {
    const W3 = (i) => wl[i];
    const m3 = (a, b) => [(a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2];
    const torsoW = len(sub(m3(W3(11), W3(12)), m3(W3(23), W3(24))));
    if (!atk && torsoW > 0.15) { const k = torsoMeters() / torsoW; kScale = kScale ? kScale * 0.95 + k * 0.05 : k; }
    const a = W3(15), b = W3(16), s = kScale || 1;
    const raw = [-((a.x * vl + b.x * vr) / (vl + vr)) * s, ((a.y * vl + b.y * vr) / (vl + vr)) * s, -((a.z * vl + b.z * vr) / (vl + vr)) * s];
    hand3 = hand3 ? [hand3[0] * 0.45 + raw[0] * 0.55, hand3[1] * 0.45 + raw[1] * 0.55, hand3[2] * 0.6 + raw[2] * 0.4] : raw; // depth is noisier
  }

  if (atk) {
    setChip(true, t("chip.dodging"));
    dodge.update({ t: tt, T: torsoPx, sm, hand: hand2, nose, wristGap: Math.hypot(lw.x - rw.x, lw.y - rw.y), speed: detector.speed });
    if (hand3) detector.reset(hand3, tt);
  } else {
    dodge.baseline(sm);
    if (!commanding) setChip(true, t(detector.state === "idle" ? "chip.kamae" : "chip.cutting"));
    if (hand3) detector.update(hand3, tt);
  }
}

// Dodge detector: compares the shoulders against a standing baseline captured just before the attack.
const dodge = {
  base: null, armed: null, guardSince: 0, last: null,
  baseline(sm) { this.base = this.base ? { x: this.base.x * 0.92 + sm.x * 0.08, y: this.base.y * 0.92 + sm.y * 0.08 } : { ...sm }; },
  arm() { this.armed = this.base ? { ...this.base } : null; this.guardSince = 0; this.last = null; },
  update({ t: tt, T, sm, hand, nose, wristGap, speed }) {
    if (!this.armed) { this.armed = { ...sm }; return; }
    const drop = (sm.y - this.armed.y) / T, shift = Math.abs(sm.x - this.armed.x) / T;
    if (drop > 0.45) return tryDodge("crouch");
    if (shift > 0.6) return tryDodge("step");
    // sword held upright in front of the face: hands together between chin and upper chest, held still
    const upright = hand.y < sm.y + 0.25 * T && hand.y > nose.y - 0.6 * T && wristGap < 0.7 * T && speed < 0.9;
    if (upright) { this.guardSince = this.guardSince || tt; if (tt - this.guardSince > 250) tryDodge("guard"); }
    else this.guardSince = 0;
  },
};

// Swing detector on the 3D hand path (m/s). It only measures; judge() decides whether it was a cut.
const START = 1.6, STOP = 0.6, ONSET = 0.45;
const detector = {
  state: "idle", prev: null, speed: 0, hist: [], s: null, cool: 0,
  lost() { this.prev = null; this.speed = 0; this.state = "idle"; },
  reset(p, tt) { this.state = "idle"; this.hist = []; this.prev = { p, t: tt }; this.speed = 0; this.cool = tt + 600; },
  update(p, tt) {
    if (this.prev) {
      const dt = (tt - this.prev.t) / 1000;
      if (dt > 0) this.speed = this.speed * 0.4 + (len(sub(p, this.prev.p)) / dt) * 0.6;
    }
    this.prev = { p, t: tt };
    this.hist.push({ p, t: tt, s: this.speed }); while (this.hist.length && tt - this.hist[0].t > 800) this.hist.shift();

    if (this.state === "idle") {
      if (this.speed > START && tt > this.cool) {
        let i = this.hist.length - 1;
        while (i > 0 && this.hist[i - 1].s > ONSET) i--;      // walk back to where the motion began
        const from = this.hist.slice(Math.max(0, i - 1));
        this.s = { tStart: from[0].t, start: from[0].p, pts: from.map((h) => h.p), speeds: from.map((h) => h.s), low: 0 };
        this.state = "swing";
      }
    } else if (this.state === "swing") {
      const s = this.s; s.pts.push(p); s.speeds.push(this.speed);
      if (this.speed < STOP) s.low = s.low || tt; else s.low = 0;
      if ((s.low && tt - s.low > 80) || tt - s.tStart > 1600) {
        s.end = p; s.tEnd = tt; s.settleSum = 0; s.settleN = 0;
        this.state = "settle";
      }
    } else if (this.state === "settle") {
      const s = this.s; s.settleSum += this.speed; s.settleN++;
      if (tt - s.tEnd > 280 || this.speed > START) this.finish();
    }
  },
  finish() {
    const s = this.s; this.state = "idle"; this.cool = performance.now() + 100;
    const ch = sub(s.end, s.start), amp = len(ch);
    if (amp < 0.18) return; // wrist flick, not a swing
    const dir = scl(ch, 1 / amp);
    let wob = 0;
    s.pts.forEach((q) => { const r = sub(q, s.start), along = dot(r, dir); wob = Math.max(wob, len(sub(r, scl(dir, along)))); });
    const peak = Math.max(...s.speeds), pi = s.speeds.indexOf(peak);
    let run = 0, dip = 0;
    for (let i = 0; i < pi; i++) { run = Math.max(run, s.speeds[i]); dip = Math.max(dip, (run - s.speeds[i]) / peak); }
    onMeasure({ peak, dir, amp, wob: wob / amp, dip, settle: s.settleN ? s.settleSum / s.settleN : 2, tStart: s.tStart, tEnd: s.tEnd });
  },
};

show("title");
</script>
</body></html>
