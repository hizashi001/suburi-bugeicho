<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NINJA SAMURAI WORKOUT: GHOST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one narrow scroll column like a field notebook; in battle the camera stage fills the phone screen and everything a
   player 2–3 m away must notice is shape, colour and sound. Deliberately single-theme (indigo night). */
:root {
  --ai: #131d33;        /* 藍: page */
  --ai-2: #1b2945;      /* panels */
  --ai-3: #24365a;      /* raised controls */
  --washi: #ebe5d5;     /* 和紙: text, and the paper behind white-background art */
  --ink: #0c1222;       /* 墨: silhouettes */
  --muted: #9ba6bc;
  --kin: #d6ab4c;       /* 金: now cut / accent */
  --shu: #cf4a33;       /* 朱: dodge / danger */
  --moe: #6fbf8e;       /* 萌黄: success */
  --line: rgba(235,229,213,.14);
  /* grades: 数打 → 最上大業物, then 名物 */
  --g0: #9ba6bc; --g1: #ebe5d5; --g2: #6fbf8e; --g3: #79a7e8; --g4: #d6ab4c; --g5: #e0703c;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ai); color: var(--washi); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}
body.in-battle { padding-top: env(safe-area-inset-top, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 2rem; line-height: 1.2; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; }
small.gloss { display: block; font-family: var(--f-body); font-size: .62em; font-weight: 400; color: var(--muted); letter-spacing: 0; line-height: 1.3; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .72rem; letter-spacing: .14em; color: var(--muted); }
button {
  font: inherit; color: var(--washi); background: var(--ai-3); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px 14px; cursor: pointer; min-height: 44px;
}
button:hover { border-color: var(--kin); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--kin); outline-offset: 2px; }
button.primary { background: var(--kin); color: #1a1408; border-color: var(--kin); font-weight: 700; }
button.ghost { background: transparent; }
button.mini { min-height: 32px; padding: 4px 10px; font-size: .82rem; }
button:disabled { opacity: .45; cursor: not-allowed; }
button[aria-pressed="true"] { border-color: var(--kin); background: color-mix(in srgb, var(--kin) 18%, var(--ai-3)); }
input[type=number], select {
  font: inherit; color: var(--washi); background: var(--ai); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; min-height: 40px; max-width: 100%;
}
input[type=number] { width: 5.5em; font-variant-numeric: tabular-nums; }
.panel { background: var(--ai-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--kin); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { padding: 8px 6px; min-height: 40px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.seg button b { font-family: var(--f-display); }
.seg button span { font-size: .72rem; color: var(--muted); }

/* Title */
.masthead { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.masthead .sub { color: var(--kin); font-family: var(--f-display); font-size: 1rem; letter-spacing: .3em; }
.status-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.status-strip > div { background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; min-width: 0; }
.status-strip b { font-size: 1.05rem; font-family: var(--f-display); overflow-wrap: anywhere; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 16px; }
.mode strong { font-family: var(--f-display); font-size: 1.3rem; }
.mode span { color: var(--muted); font-size: .86rem; }
.mode.kin { border-color: var(--kin); background: color-mix(in srgb, var(--kin) 10%, var(--ai-3)); }
.soon { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.soon > div { background: var(--ai-2); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.soon b { font-family: var(--f-display); }
.soon span { font-size: .75rem; color: var(--muted); }
.soon em { font-style: normal; font-size: .7rem; color: var(--kin); }
.tile-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 0; }
.tile-btn b { font-family: var(--f-display); font-size: 1.05rem; }
.tile-btn span { font-size: .75rem; color: var(--muted); }

/* Setup */
.wslot { display: grid; grid-template-columns: 2.2em 1fr; gap: 10px; align-items: start; padding-block: 10px; border-top: 1px dotted var(--line); }
.wslot:first-child { border-top: 0; }
.wslot .no { font-family: var(--f-display); font-size: 1.6rem; color: var(--kin); line-height: 1.2; text-align: center; }
.wslot .fields { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.diffs { display: flex; flex-direction: column; gap: 6px; }
.diffs button { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 10px; align-items: center; text-align: left; }
.diffs button b { font-family: var(--f-display); font-size: 1.1rem; }
.diffs button span { font-size: .8rem; color: var(--muted); }
.diffs button em { font-style: normal; font-size: .8rem; color: var(--kin); }
.warn { border-left: 3px solid var(--shu); padding: 8px 12px; background: color-mix(in srgb, var(--shu) 10%, var(--ai-2)); border-radius: 0 6px 6px 0; font-size: .85rem; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: .86rem; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px dotted var(--line); padding-block: 2px; gap: 8px; }

/* Forms (型) */
.forms { display: flex; flex-direction: column; gap: 6px; }
.form-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; }
.form-row .info { min-width: 0; display: flex; flex-direction: column; }
.form-row .info b { font-family: var(--f-display); }
.arrow { width: 44px; height: 44px; }
.arrow.big { width: 72px; height: 72px; }

/* Yokai */
.monsters { display: flex; flex-direction: column; gap: 8px; }
.mon { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px 12px; background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; }
.mon .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mon .info b { font-family: var(--f-display); font-size: 1.05rem; }
.seal {
  position: relative; overflow: hidden;
  width: 56px; height: 56px; display: grid; place-items: center; border: 2px solid var(--shu); color: var(--shu);
  font-family: var(--f-display); font-size: 2rem; border-radius: 4px; background: color-mix(in srgb, var(--shu) 8%, transparent);
}
.seal.sm { width: 44px; height: 44px; font-size: 1.6rem; }
.seal.huge { width: min(52vw, 240px); height: auto; aspect-ratio: 3 / 4; font-size: 7rem; border-width: 3px; }
.seal img.art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 25%; opacity: 0; transition: opacity .3s; }
.seal.has-art { color: transparent; }
.seal.has-art img.art { opacity: 1; }
.seal.gold { border-color: var(--kin); color: var(--kin); background: color-mix(in srgb, var(--kin) 14%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--kin) 40%, transparent); }
.seal.locked { border-color: var(--line); color: var(--muted); background: none; }
.seal.tame { border-color: var(--moe); color: var(--moe); background: color-mix(in srgb, var(--moe) 10%, transparent); }
.tag { display: inline-block; font-size: .7rem; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; line-height: 1.5; font-family: var(--f-body); font-weight: 400; }
.tag.gold { color: var(--kin); } .tag.boss { color: var(--shu); } .tag.taisho { color: var(--g3); }
.hpbar { height: 8px; background: rgba(0,0,0,.4); border-radius: 4px; overflow: hidden; }
.hpbar i { display: block; height: 100%; width: 100%; background: var(--shu); transition: width .25s ease-out; }
.hpbar.me i { background: var(--moe); }
.hpbar.stag { height: 4px; } .hpbar.stag i { background: var(--kin); }

/* Gear */
.g0 { --gc: var(--g0); } .g1 { --gc: var(--g1); } .g2 { --gc: var(--g2); } .g3 { --gc: var(--g3); } .g4 { --gc: var(--g4); } .g5 { --gc: var(--g5); }
.item { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--ai-2); border: 1px solid var(--line); border-left: 4px solid var(--gc, var(--g0)); border-radius: 8px; }
.item .nm { font-family: var(--f-display); font-size: 1rem; color: var(--gc, var(--g0)); line-height: 1.35; }
.af { font-size: .78rem; color: var(--muted); display: flex; flex-direction: column; }
.af .kw { color: var(--kin); font-weight: 700; }
.af .rare { color: var(--g5); }
.item .acts { display: flex; gap: 6px; flex-direction: column; }
.item.on { background: color-mix(in srgb, var(--kin) 10%, var(--ai-2)); }
.item.off { opacity: .55; }
/* white-background art sits on a washi card so its white melts into the paper */
.thumb { width: 48px; height: 48px; border-radius: 6px; background: var(--washi); display: grid; place-items: center; overflow: hidden; color: #3a2f1c; font-family: var(--f-display); font-size: 1.4rem; border: 2px solid var(--gc, var(--g0)); position: relative; flex: none; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.thumb.big { width: 120px; height: 120px; font-size: 3.4rem; }
.thumb.empty { background: #0d1424; color: #2b3956; border-color: var(--line); }
/* 身支度: the player's shadow in the middle, the nine slots round it */
.dressing { position: relative; width: 100%; aspect-ratio: 4 / 5; background: radial-gradient(ellipse at 50% 42%, #f1ead7 0%, #d9cfb4 62%, #b8ab8a 100%); border-radius: 12px; overflow: hidden; }
.dressing svg.fig { position: absolute; left: 22%; top: 4%; width: 56%; height: 88%; }
.dressing .ds { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; min-height: 0; color: #2a2116; width: 21%; }
.dressing .ds .thumb { width: 100%; height: auto; aspect-ratio: 1; font-size: 1.6rem; background: rgba(255,255,255,.55); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.dressing .ds .thumb.empty { background: rgba(12,18,34,.12); color: rgba(12,18,34,.35); border: 2px dashed rgba(12,18,34,.3); }
.dressing .ds span { font-size: .68rem; font-weight: 700; line-height: 1.1; text-align: center; }
.dressing .ds[aria-pressed="true"] .thumb { outline: 3px solid var(--shu); outline-offset: 2px; }
.dressing .kindtag { position: absolute; left: 50%; top: 2%; transform: translateX(-50%); font-family: var(--f-display); color: var(--ink); font-size: .95rem; background: rgba(255,255,255,.5); padding: 0 10px; border-radius: 4px; }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.book .card { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px; background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.book .card.partner { border-color: var(--kin); }
.stars { color: var(--kin); letter-spacing: .1em; font-size: .85rem; }
.sword-card { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--ai-2); border: 1px solid var(--line); border-radius: 8px; }
.sword-card.done { border-color: var(--g5); }
.sword-card .parts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sword-card .part { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--muted); }
.sword-card .part .thumb { width: 100%; height: auto; aspect-ratio: 1; }
.sword-card details summary { cursor: pointer; font-size: .82rem; color: var(--kin); }
.flavor { font-family: var(--f-display); font-size: 1.05rem; }

/* Battle: the stage is the whole phone screen */
.stage {
  position: relative; width: 100%; height: calc(100dvh - env(safe-area-inset-top, 0px) - 8px); min-height: 480px;
  background: #0b1222; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
}
.stage.hit::after, .stage.ok::after, .stage.flash::after, .stage.goldfl::after { content: ""; position: absolute; inset: 0; animation: fadeout .5s ease-out forwards; pointer-events: none; z-index: 8; }
.stage.hit::after { background: rgba(207,74,51,.45); }
.stage.ok::after { background: rgba(111,191,142,.4); }
.stage.flash::after { background: rgba(255,240,200,.55); animation-duration: .35s; }
.stage.goldfl::after { background: rgba(214,171,76,.4); }
@keyframes fadeout { to { opacity: 0; } }
.stage video, .stage canvas.mirror, #freeze { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.stage video { opacity: .8; }
#fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#freeze { z-index: 2; pointer-events: none; }
.stage.slowmo .pop { animation-duration: 2.2s; }
.stage.slowmo video, .stage.slowmo #freeze { filter: contrast(1.2) saturate(1.4) brightness(1.15); }
.stage .placeholder { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
.hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; z-index: 5; }
.hud-foe { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; background: rgba(10,16,30,.62); border-radius: 8px; padding: 6px 8px; }
.hud-foe .grow { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hud-foe b { font-family: var(--f-display); font-size: 1rem; }
.timer { font-family: var(--f-display); font-size: 1.1rem; }
.timer.big { font-size: 2.2rem; line-height: 1; color: var(--kin); }
.hud-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.chips { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.combo { text-align: right; font-family: var(--f-display); text-shadow: 0 2px 8px rgba(0,0,0,.7); }
.combo .n { font-size: 2.6rem; line-height: 1; color: var(--kin); }
.combo .m { font-size: .9rem; }
.combo .win { width: 110px; height: 5px; background: rgba(0,0,0,.45); border-radius: 3px; margin-top: 4px; margin-left: auto; overflow: hidden; }
.combo .win i { display: block; height: 100%; background: var(--kin); }
.chip { background: rgba(10,16,30,.8); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .78rem; }
.chip.ok { border-color: var(--moe); color: var(--moe); }
.chip.ng { border-color: var(--shu); color: #f0a091; }
.chip.note { border-color: var(--muted); color: var(--washi); font-size: .9rem; }
.chip.run { border-color: var(--kin); color: var(--kin); font-family: var(--f-display); font-size: .9rem; }
/* cue layer: big translucent shapes read from across the room */
#cue { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
#cue .half { position: absolute; display: grid; place-items: center; }
#cue .half svg, #cue .full svg { width: 70%; height: 70%; }
#cue .full { position: absolute; inset: 0; display: grid; place-items: center; }
#cue .red { background: rgba(207,74,51,.26); }
#cue .gold { background: rgba(214,171,76,.16); }
#cue .label { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font-family: var(--f-display); font-size: 1.4rem; color: var(--washi); text-shadow: 0 2px 10px rgba(0,0,0,.9); letter-spacing: .05em; }
#frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
.pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.pop {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; font-family: var(--f-display);
  text-shadow: 0 3px 12px rgba(0,0,0,.85); animation: rise 1.1s ease-out forwards; white-space: nowrap;
}
.pop .d { font-size: 3rem; color: var(--washi); line-height: 1; }
.pop .t { font-size: 1rem; color: var(--kin); }
.pop.S .d { color: var(--kin); font-size: 3.6rem; }
.pop.crit .d { color: var(--g5); font-size: 3.8rem; }
.pop.hurt .d { color: var(--shu); font-size: 2.4rem; }
.pop.good .d { color: var(--moe); font-size: 2.6rem; }
.pop.miss .d { color: var(--muted); font-size: 2rem; }
@keyframes rise { from { opacity: 1; transform: translate(-50%, -30%) scale(1.15); } to { opacity: 0; transform: translate(-50%, -120%) scale(1); } }
.callout { position: absolute; left: 8px; right: 8px; bottom: 64px; z-index: 7; display: flex; flex-direction: column; gap: 6px; }
.callout .dodges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.callout .dodges button { min-height: 40px; padding: 6px; font-size: .82rem; }
.regbox { position: absolute; left: 8px; right: 8px; bottom: 64px; z-index: 7; background: rgba(10,16,30,.86); border: 2px solid var(--kin); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.regbox .who { color: var(--kin); font-size: .85rem; }
.regbox .regrow { display: flex; gap: 12px; align-items: center; justify-content: center; }
.regbox .cue { font-family: var(--f-display); font-size: 1.8rem; line-height: 1.15; }
.dock { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 10; display: flex; gap: 6px; align-items: center; }
.dock button { min-height: 44px; padding: 6px 10px; font-size: .85rem; background: rgba(36,54,90,.85); white-space: nowrap; }
.dock button.primary { background: var(--kin); }
.dock .sw { display: flex; gap: 4px; margin-left: auto; }
.dock .sw button { padding: 4px 8px; font-size: .78rem; line-height: 1.2; }
.verdict { position: absolute; inset: 0; z-index: 9; display: grid; place-items: center; background: rgba(8,12,24,.78); text-align: center; }
.verdict > div { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 20px; max-width: 100%; }
.verdict h2 { font-size: 2rem; color: var(--washi); }
.verdict .hiden { font-size: .9rem; color: var(--kin); }
.verdict .pts { font-family: var(--f-display); font-size: 2.6rem; color: var(--kin); line-height: 1; }
.verdict .mini-drops { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.verdict .mini-drops .thumb { width: 72px; height: 72px; font-size: 2rem; box-shadow: 0 0 18px color-mix(in srgb, var(--gc) 60%, transparent); animation: dropin .5s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes dropin { from { transform: scale(2) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }

.lastswing { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.rank { font-family: var(--f-display); font-size: 3rem; line-height: 1; width: 1.3em; text-align: center; color: var(--muted); }
.rank.S { color: var(--kin); } .rank.A { color: var(--washi); } .rank.C { color: var(--shu); }
.bars { display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: .8rem; }
.bars .b { display: grid; grid-template-columns: 4.5em 1fr 2.4em; gap: 8px; align-items: center; }
.bars .b > span:last-child { text-align: right; }
.meter { height: 6px; background: rgba(0,0,0,.35); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--washi); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: .82rem; }
.log li { display: grid; grid-template-columns: 1.6em 6.5em 1fr auto; gap: 8px; border-bottom: 1px dotted var(--line); padding-block: 3px; }
.log li .r { font-family: var(--f-display); }

}
.res-inner { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-block: 20px 20px; }
.res-inner > * { animation: up .45s ease-out both; animation-delay: var(--d, 0s); }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.stamp {

@keyframes stamp { from { opacity: 0; transform: rotate(-7deg) scale(2.4); } to { opacity: 1; transform: rotate(-7deg) scale(1); } }
.score { text-align: center; display: flex; flex-direction: column; align-items: center; }

.gest { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--ai) 30%); }
.gest button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 12px; }
.gest button b { font-family: var(--f-display); font-size: 1.2rem; }
.gest button span { font-size: .78rem; color: var(--muted); }
.gest .meter { width: 100%; height: 8px; }

.setdone { position: fixed; inset: 0; z-index: 35; background: rgba(8,12,24,.94); display: grid; place-items: center; text-align: center; padding: 24px; }

/* hit: the stage shakes a little */
.stage.shake { animation: shake .36s linear; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-7px, 3px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-4px, 3px); } 80% { transform: translate(3px, -2px); } }
/* slain: the yokai is cut in two along the stroke and burns away into embers (no blood) */
.slain { position: relative; width: 150px; height: 200px; margin: 0 auto; }
.slain .half { position: absolute; inset: 0; display: grid; place-items: center; }
.slain .half .seal { width: 100%; height: 100%; font-size: 5.5rem; }
.slain .half.a { clip-path: polygon(0 0, 100% 0, 0 100%); animation: cutA 1.4s cubic-bezier(.2,.7,.3,1) .18s forwards; }
.slain .half.b { clip-path: polygon(100% 0, 100% 100%, 0 100%); animation: cutB 1.4s cubic-bezier(.2,.7,.3,1) .18s forwards; }
.slain .cut { position: absolute; left: 50%; top: 50%; width: 150%; height: 6px; background: #fff; box-shadow: 0 0 18px #fff, 0 0 36px var(--kin); transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); animation: cutLine .5s ease-out forwards; }
.slain .ember { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: #ffb347; box-shadow: 0 0 8px #ff7a2e; opacity: 0; animation: ember 1.2s ease-out forwards; animation-delay: var(--dl); }
@keyframes cutA { 0% { transform: none; filter: none; } 35% { transform: translate(-12px, -12px) rotate(-5deg); filter: brightness(1.6); } 100% { transform: translate(-56px, -60px) rotate(-16deg); filter: brightness(2.2) sepia(1) blur(3px); opacity: 0; } }
@keyframes cutB { 0% { transform: none; filter: none; } 35% { transform: translate(12px, 12px) rotate(5deg); filter: brightness(1.6); } 100% { transform: translate(56px, 52px) rotate(16deg); filter: brightness(2.2) sepia(1) blur(3px); opacity: 0; } }
@keyframes cutLine { 0% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(0); opacity: 1; } 40% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-45deg) scaleX(1); opacity: 0; } }
@keyframes ember { 0% { opacity: 0; transform: translate(-50%, -50%); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3); } }
/* errors on screen, for testing on the phone */

<script>
// any error is shown on screen, so it can be read off the phone during testing
(function () {
  const show = (msg) => { const b = document.getElementById("errbox"); if (!b) return; b.hidden = false; b.textContent = ("⚠ " + msg + "\n" + b.textContent).slice(0, 1200); };
  window.addEventListener("error", (e) => show(`${e.message} (${(e.filename || "").split("/").pop()}:${e.lineno || ""})`));
  window.addEventListener("unhandledrejection", (e) => show(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  document.addEventListener("click", (e) => { if (e.target.id === "errbox") e.target.hidden = true; });
})();
</script>

// ---------- language files and data ----------

const LANGS = ["ja", "en"];
const KEY = "suburi-bugeicho.v1";
let saved = {};

// ---------- the day: it turns over at 22:00 in Japan (UTC 13:00) for everyone ----------
const DAY_MS = 86400000, TURN_MS = 13 * 3600000;
const dayId = (now = Date.now()) => Math.floor((now - TURN_MS) / DAY_MS);
// a seed everyone shares today; salt keeps the mountain, TABATA and so on independent
function daySeed(salt) {
  let h = (2166136261 ^ dayId()) >>> 0;
  for (const c of salt) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return h >>> 0;
}
// 登頂: one state per division, cleared when the day turns over
function climbOf(div = S.division) {
  const d = dayId();
  let c = S.climb[div];
  if (!c || c.day !== d) c = S.climb[div] = { day: d, floor: 1, reached: 0, score: 0, lv: 1, exp: 0, inv: [], equip: {}, nextId: 1 };
  return c;
}

// ---------- gear stats ----------
const itemById = (id) => gearBag().inv.find((i) => i.id === id);
// equipped items that apply now: sword parts only of the kind you are holding
function equippedItems(k = kind()) {
  return SLOTS.map((slot) => itemById(gearBag().equip[slot])).filter((it) => it && (!it.kind || it.kind === k));
}
function gearStats(on) {
  const o = { damage: 0, s_rank_damage: 0, hiden_damage: 0, combo_cap: 0, stagger: 0, finisher: 0, dodge_window: 0, combo_window: 0,
    damage_taken: 0, max_hp: 0, exp: 0, drop_rate: 0, gold_rate: 0, rares: new Set(), set4: null, setTier: 0, mixed: false, partner: {} };
  if (!on) return o;
  const items = equippedItems();
  for (const it of items) {
    o[it.main.key] += it.main.v;
    it.affixes.forEach((a) => (o[a.key] += a.v));
    if (it.rare) o.rares.add(it.rare);
  }
  for (const [k, cap] of Object.entries(L.caps)) o[k] = Math.min(o[k], cap);
  const counts = {};
  items.filter((it) => it.named).forEach((it) => (counts[it.named] = (counts[it.named] || 0) + 1));
  const top = Math.max(0, ...Object.values(counts));
  if (top >= 4) { o.set4 = Object.keys(counts).find((k) => counts[k] >= 4); o.setTier = 4; }
  else if (top === 3) { o.damage += L.set.three; o.setTier = 3; }
  else if (top === 2) { o.damage += L.set.two; o.setTier = 2; }
  if (Object.keys(counts).length === 4 && top === 1) { o.exp += L.set.mixedExp; o.mixed = true; }
  const p = MONSTERS.find((m) => m.id === S.partner);
  if (p && S.shiki[p.id] && mode !== "climb") o.partner = p.partner; // nothing is carried up the mountain
  return o;
}

// 登頂: the day's pickings go on at once when they beat what is worn (nothing else to choose from on the mountain)
function climbEquip(c, items) {
  for (const it of items) {
    c.inv.push(it);
    if (it.kind && it.kind !== kind()) continue;
    const cur = c.inv.find((i) => i.id === c.equip[it.slot]);
    if (!cur || it.grade > cur.grade || (it.grade === cur.grade && it.main.v > cur.main.v)) c.equip[it.slot] = it.id;
  }
}

// mostly the newest few
const normalFor = (wave, r) => NORMALS[Math.max(0, Math.min(NORMALS.length - 1, Math.floor((wave - 1) / 2)) - Math.floor(r() * 3))];
const variantFor = (r, goldChance) => (r() < goldChance ? "gold" : r() < B.enemy.taishoChance ? "taisho" : "base");
// the boss on a climb floor is the same for everyone today
const climbBoss = (floor) => BOSSES[Math.floor(makeRng(daySeed("climb:" + floor))() * BOSSES.length)];
function pickYokai(wave, st) {
  const goldChance = B.enemy.goldChance * (1 + st.gold_rate / 100) * (st.rares.has("kinun") ? 1 + L.rareValues.kinun / 100 : 1) * (has4(st, "sword_05_kogitsunemaru") ? 1.3 : 1);
  if (mode === "climb") {
    if (wave % B.run.bossEvery === 0) return { m: climbBoss(wave), variant: "base" };
    // 侍部門: everyone meets the same yokai. 武士部門: the same table but each player's own draw, and 座敷童 may appear.
    const fixed = makeRng(daySeed("climb:" + wave)); fixed();
    const r = bushi() ? Math.random : fixed;
    if (bushi() && r() < B.climb.zashikiChance * (st.rares.has("shofuku") ? B.climb.shofukuMult : 1)) return { m: ZASHIKI, variant: "base" };
    return { m: normalFor(wave, r), variant: variantFor(r, goldChance) };
  }
  if (wave % B.run.bossEvery === 0) return { m: BOSSES[(wave / B.run.bossEvery - 1) % BOSSES.length], variant: "base" };
  return { m: normalFor(wave, Math.random), variant: variantFor(Math.random, goldChance) };
}
function nextYokai() {

// a yokai falls: points, EXP, drops and maybe a shikigami, then straight on to the next one
function killYokai(finMult = 1, finKind = null, stillness = 0) {
  const m = foe.m, st = P.st;
  phase = "kill"; endAttack(); clearCue(); setFrame(0); P.stag = null;
  const points = Math.round(foe.dmg * finMult);
  R.score += points; R.kills++;
  S.kills[m.id] = (S.kills[m.id] || 0) + 1;
  S.bestScore[m.id] = Math.max(S.bestScore[m.id] || 0, points);
  const gold = foe.variant === "gold", taisho = foe.variant === "taisho";
  const exp = Math.round(m.exp * diff().bonus * (1 + (st.exp + (st.partner.exp || 0)) / 100) * (gold ? B.enemy.goldExp : taisho ? B.enemy.taishoExp : 1));
  const lv = R.climb ? R.c : S; // the climb has its own level
  R.exp += exp; lv.exp += exp;
  while (lv.exp >= expNeed(lv.lv)) { lv.exp -= expNeed(lv.lv); lv.lv++; SKILLS.filter((s) => s.lv === lv.lv).forEach((s) => R.learned.push(s)); }
  // 侍部門 on the mountain drops nothing; 武士部門 drops count only for today's climb
  const drops = R.climb && !bushi() ? [] : rollDrops(newSeed(), L, SW, { asset: m.asset, boss: !!m.boss, gold, taisho, zashiki: m === ZASHIKI, kind: kind(), dropRate: st.drop_rate + (st.partner.drop_rate || 0) });
  drops.forEach((it) => { it.id = R.climb ? R.c.nextId++ : S.nextId++; if (it.named) (S.seen[it.named] ||= {})[it.slot] = true; });
  if (R.climb) climbEquip(R.c, drops); else addItems(drops);
  R.drops.push(...drops);
  if (R.climb) {
    R.c.floor = R.wave + 1; R.c.reached = Math.max(R.c.reached, R.wave); R.c.score += points;
    S.climbBest[S.division] = Math.max(S.climbBest[S.division] || 0, R.wave);
    const hpGone = P.hpMax - P.hp; P.st = stats(); P.hpMax = maxHp(P.st); P.hp = P.hpMax - hpGone;
  }
  if (!R.climb && Math.random() < (gold ? 0.7 : 0.3)) {
    const sh = S.shiki[m.id];
    if (!sh) { S.shiki[m.id] = { stars: 1, gold }; R.tamed.push(m); if (!S.partner) S.partner = m.id; }
    else { sh.stars = Math.min(5, sh.stars + 1); sh.gold = sh.gold || gold; }
  }
  P.hp = Math.min(P.hpMax, P.hp + P.hpMax * (R.climb ? B.climb.healOnKill : B.run.healOnKill));
  save(); renderHud();
  flash("goldfl"); play("slay"); setTimeout(() => play(m.boss ? "fanfare" : "chime"), 350);
  if (drops.some((it) => it.grade >= 3)) setTimeout(() => play("ring"), 500);
  const ms = (B.bout.killPauseSec + 0.35 * drops.length + (m.boss ? 1.2 : 0)) * 1000;
  const art = `<div class="seal huge${gold ? " gold" : ""}">${monArt(m, foe.variant)}</div>`;
  const embers = Array.from({ length: 12 }, (_, i) => `<i class="ember" style="--dx:${Math.round(rand(-90, 90))}px;--dy:${Math.round(rand(-120, -20))}px;--dl:${(0.25 + i * 0.05).toFixed(2)}s"></i>`).join("");
  showVerdict(`<div class="slain"><div class="half a">${art}</div><div class="half b">${art}</div><i class="cut"></i>${embers}</div>
    <div class="stamp sm${gold || m.boss ? " kin" : ""}${LANG === "ja" ? "" : " latin"}">${esc(t("stamp.slain"))}</div>
    <span class="pts num">+${fmt(points)}</span>${finKind ? `<span class="small">${esc(t("res.scoreCalc", { dmg: fmt(foe.dmg), x: finMult.toFixed(2), how: t("fin." + finKind) }))}</span>` : ""}
    <div class="mini-drops">${drops.map((it, i) => `<div class="thumb g${it.grade}" style="animation-delay:${0.15 + i * 0.18}s">${SLOT_GLYPH[it.slot]}${imgTag(itemFile(it), "")}</div>`).join("")}</div>
    <span class="small muted">EXP +${fmt(exp)}</span>`, ms, () => { if (fighting()) nextYokai(); });
}

// ---------- TABATA: 20 s with one yokai and one fixed form, 10 s rest, six times (3 minutes) ----------
// today's forms and yokai: the same for everyone, new every day at 22:00 JST
function tabataPlan() {
  const r = makeRng(daySeed("tabata"));
  const pool = TYPES.map((x) => x.id).map((v) => [r(), v]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  const forms = Array.from({ length: B.tabata.rounds }, (_, i) => pool[i % pool.length]);
  return { forms, mons: forms.map(() => NORMALS[Math.floor(r() * NORMALS.length)]) };
}
function startTabata() {
  closeResult();
  if ($("scr-battle").hidden) show("battle");
  mode = "tabata"; reg = null; R = null;
  P = newPlayer();
  const plan = tabataPlan();
  TB = { round: 0, forms: plan.forms, mons: plan.mons, score: 0, kills: 0, rounds: [], until: 0 };
  resetBattleUI();
  $("btn-retreat").textContent = t("tabata.quit");
  $("b-timer").className = "timer num big";
  ambience(true); bgm("bgm_tabata");
  tabataRest(B.tabata.prepSec);
}
function tabataRest(sec) {
  phase = "rest"; foe = null;
  TB.until = gnow() + sec * 1000; TB.beeped = Math.ceil(sec);
  const f = TB.forms[TB.round];
  showCue(`<div class="full gold">${bigArrow(tmpl(TYPE[f]).dir, "var(--kin)")}</div><div class="label">${esc(t("tabata.next", { n: TB.round + 1, total: B.tabata.rounds }))}<br>${nameHtml("type." + f)}</div>`);
  renderHud();
}
function tabataWork() {
  TB.round++;
  const m = TB.mons[TB.round - 1];
  const max = Math.round(B.tabata.hp * (1 + B.tabata.hpPerRound * (TB.round - 1)));
  foe = { m, wave: TB.round, variant: "base", hp: max, max, dmg: 0, atkDmg: 0, tags: tagsOf(m.asset), stagger: B.stagger.max, form: TB.forms[TB.round - 1] };
  phase = "fight"; TB.until = gnow() + B.tabata.workSec * 1000; TB.start = gnow();
  showCue(`<div class="full" style="background:rgba(214,171,76,.07)">${bigArrow(tmpl(TYPE[foe.form]).dir, "rgba(214,171,76,.5)")}</div>`);
  play("gong"); renderHud();
}
function tabataRoundEnd(killed) {
  const r = { form: foe.form, m: foe.m, dmg: foe.dmg, killed, bonus: 0 };
  if (killed) r.bonus = B.tabata.killBonus + Math.round(Math.max(0, (TB.until - gnow()) / 1000) * B.tabata.timeBonusPerSec);
  TB.rounds.push(r); TB.score += r.dmg + r.bonus; if (killed) TB.kills++;
  if (killed) { flash("goldfl"); play("chime"); popup("S", t("stamp.slain"), `+${fmt(r.dmg + r.bonus)}`); }
  if (TB.round >= B.tabata.rounds) return finishTabata();
  if (killed) { phase = "cleared"; foe.hp = 0; clearCue(); renderHud(); return; } // wait out the 20 s
  play("whistle"); tabataRest(B.tabata.restSec);
}
function tabataTick(now) {
  const left = (TB.until - now) / 1000;
  $("b-timer").textContent = Math.max(0, Math.ceil(left));
  if (phase === "rest") {
    if (left <= 3 && Math.ceil(left) < TB.beeped) { TB.beeped = Math.ceil(left); if (TB.beeped > 0) play("beep"); }
    if (left <= 0) tabataWork();
  } else if (phase === "fight" || phase === "cleared") {
    if (left <= 0) { if (phase === "fight") tabataRoundEnd(false); else { play("whistle"); tabataRest(B.tabata.restSec); } }
  }
}

// ---------- judging (unchanged: swings are compared with your registered forms) ----------
// A follow-through recovery (sword coming back the opposite way, slower) is never a cut.

  if (d.ang != null && ang > d.ang) reasons.push(t("why.angle", { a: Math.round(ang) }));
  if (d.amp != null && ampR < d.amp) reasons.push(t("why.amp"));

  const ampPts = 30 * clamp01(j.ampR);

let lastDetect = null; // for the diagnostics line

function onSwing(m, j) {

    if (tanto) noise({ sec: 0.09, f0: 2600 * p, f1: 4200 * p, q: 1.4, vol: 0.32 });
    else noise({ sec: 0.18, f0: 700 * p, f1: 2600 * p, q: 1.1, vol: 0.38 });
  }
  if (c > 0 && !playFile(tanto ? "hit_tanto" : "hit_katana", { rate: p * cp })) {

    noise({ sec: 0.07, f0: 1800 * p, f1: 700, vol: 0.28, type: "bandpass" });
    if (c > 1) tone({ f: COMBO_NOTES[Math.min(step, COMBO_NOTES.length - 1)], sec: 0.22, vol: 0.09, type: "square", delay: 0.03 });
  }
  if (rank === "S" || crit) {

      noise({ sec: 0.25, f0: 5000, f1: 9000, q: 0.7, vol: 0.22, type: "highpass" });
      if (tanto) [3300, 3950, 4700].forEach((f, i) => tone({ f: f * p, sec: 0.5, vol: 0.1, delay: 0.1 + i * 0.07 }));
      else [1568, 2349, 3136, 4186].forEach((f, i) => tone({ f: f * p, sec: 1.8 - i * 0.3, vol: 0.1, delay: 0.12 + i * 0.015, type: i ? "sine" : "triangle" }));

  }
}
function sndCue(k) {

  play({ crouch: "voice_fuseyo", guard: "voice_ukeyo", stepL: "voice_tobe", stepR: "voice_tobe" }[k]);
  if (k === "crouch") { if (!playFile("cue_crouch")) { tone({ f: 70, f1: 45, sec: 0.6, vol: 0.35, type: "sawtooth" }); noise({ sec: 0.5, f0: 300, f1: 120, type: "lowpass", vol: 0.3 }); } }
  else if (k === "guard") { if (!playFile("cue_guard")) [2200, 3300].forEach((f) => tone({ f, sec: 0.7, vol: 0.12 })); }
  else if (!playFile("cue_step", { pan: k === "stepL" ? -0.8 : 0.8 })) noise({ sec: 0.6, f0: 500, f1: 1800, q: 0.8, vol: 0.4, pan: k === "stepL" ? [1, -1] : [-1, 1] });

// a low night wind under the fight
// background music: only from files (assets/sounds/bgm_*.mp3); without a file there is none
let bgmNow = null, bgmSrc = null, bgmGain = null;
async function bgm(id) {
  if (bgmNow === id) return;
  bgmNow = id;
  const a = ac; if (!a) return;          // no music before the first tap
  if (bgmSrc) { const g = bgmGain, src = bgmSrc; g.gain.setTargetAtTime(0, a.currentTime, 0.3); setTimeout(() => { try { src.stop(); } catch {} }, 1500); bgmSrc = null; }
  if (!id) return;
  if (!(id in SFX)) {
    SFX[id] = null;
    try { const r = await fetch(`assets/sounds/${id}.mp3`); if (r.ok) SFX[id] = await a.decodeAudioData(await r.arrayBuffer()); } catch {}
  }
  if (bgmNow !== id || !SFX[id]) return;
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = SFX[id]; src.loop = true; g.gain.value = B.sound.bgmVol;
  src.connect(g).connect(a.destination); src.start();
  bgmSrc = src; bgmGain = g;
}
const fightBgm = () => (mode === "climb" ? "bgm_climb" : mode === "tabata" ? "bgm_tabata" : "bgm_run");
document.addEventListener("pointerdown", () => { if (!bgmNow && $("scr-battle").hidden) { audio(); bgm("bgm_title"); } }, { once: true });
function ambience(on) {
  const a = on ? audio() : ac; if (!a) return;
  if (on && !amb) {
    const file = playFile("ambience_night", { vol: 0.5, loop: true });
    if (file) { amb = { src: file }; return; }
    const src = a.createBufferSource(); src.buffer = noiseBuf(a, 4); src.loop = true;
    const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
    const g = a.createGain(); g.gain.value = 0.035;
    const lfo = a.createOscillator(), lg = a.createGain(); lfo.frequency.value = 0.15; lg.gain.value = 0.02; lfo.connect(lg).connect(g.gain); lfo.start();
    src.connect(f).connect(g).connect(a.destination); src.start(); amb = { src, lfo };
  } else if (!on && amb) { try { amb.src.stop(); amb.lfo?.stop(); } catch {} amb = null; }
}

// ---------- remote commands by pose ----------
// ok = both hands above the head, ng = forearms crossed in front of the chest
function gestureCtx() {
  if (resultActions) return { ...resultActions, hold: { ok: 1000, ng: 1000 } };
  if (!$("scr-battle").hidden && !atk && (phase === "fight" || phase === "rest" || phase === "cleared" || mode === "reg")) return { ng: { label: t(mode === "reg" ? "reg.quit" : mode === "tabata" ? "tabata.quit" : "battle.retreat"), fn: retreat }, hold: { ng: 2000 } };
  return null;
}
const gesture = {
  kind: null, since: 0, lock: false,
  update(tt, k) {
    if (k !== this.kind) { this.kind = k; this.since = tt; if (!k) this.lock = false; }
    const ctx = gestureCtx();
    const act = ctx && k && !this.lock ? ctx[k] : null;
    const p = act ? clamp01((tt - this.since) / ctx.hold[k]) : 0;
    ["ok", "ng"].forEach((x) => { const el = $(`g-${x}-m`); if (el) el.style.width = (x === k ? p * 100 : 0) + "%"; });
    if (act && !resultActions) setChip(true, t("chip.gesture", { label: act.label, s: ((1 - p) * ctx.hold[k] / 1000).toFixed(1) }));
    if (act && p >= 1) { this.lock = true; fireGesture(k); }
    return !!act;
  },
};

// ---------- main loop ----------
function hud() {
  if (pausedAt && !document.hidden) syncPause(); // never stay paused if the "visible again" event was missed
  const now = gnow();
  if (combo > 0 && lastEnd && phase === "fight" && P) {
    const left = comboWindow(P.st) - (performance.now() - lastEnd) / 1000;
    if (left <= 0) { combo = 0; $("combo").hidden = true; }
    else {
      $("combo").hidden = combo < 2;
      $("combo-n").textContent = combo; $("combo-x").textContent = "×" + comboMult(combo, P.st).toFixed(2);
      $("combo-win").style.width = (100 * left / comboWindow(P.st)) + "%";
    }
  }
  if (!pausedAt) {
    if (mode === "tabata" && TB) tabataTick(now);
    if (fighting() && foe && P) {
      if (phase === "fight") {
        $("b-timer").textContent = `${Math.floor((now - P.fightStart) / 60000)}:${String(Math.floor(((now - P.fightStart) / 1000) % 60)).padStart(2, "0")}`;
        if (now - P.lastSwingAt > B.bout.restAfterSec * 1000) endRun("rest");
        else {
          if (P.stag) {
            const s = P.stag; setFrame(Math.max(0, (s.until - now) / (s.until - s.start)), "#d6ab4c");
            if (now > s.until) { endStagger(false); setFrame(0); }
          }
          if (bushi() && has4(P.st, "sword_09_odenta") && now - P.lastRegen > 30000) { P.lastRegen = now; P.hp = Math.min(P.hpMax, P.hp + P.hpMax * 0.05); renderHud(); }
          attackTick(now);
        }
      } else if (phase === "finisher") {
        const left = B.bout.finisherSec - (now - P.finisher.start) / 1000;
        $("b-timer").textContent = Math.max(0, left).toFixed(1);
        if (left <= 0) killYokai(1);
      } else if (phase === "zanshin") zanshinTick(now);
    }
  }

}
requestAnimationFrame(hud);

// diagnostics for real-device testing: camera frame rate and the last detected hand speed
let poseFrames = 0, poseFps = 0;
setInterval(() => {
  poseFps = poseFrames; poseFrames = 0;
  $("atk-demo").hidden = !!stream || !atk || atk.done;
  if (!$("scr-battle").hidden) $("diag").textContent = t("diag.line", { fps: stream ? poseFps : "－", speed: lastDetect ? lastDetect.peak.toFixed(1) : "－", paused: pausedAt ? t("diag.paused") : "" });
}, 1000);

// ---------- demo play (no camera) ----------
function demoMeasure() {
  const x = mode === "reg" ? TYPE[reg.queue[reg.i]]
    : mode === "tabata" && foe && Math.random() < 0.75 ? TYPE[foe.form]
    : P && P.stag && P.stag.kind === "samurai" && Math.random() < 0.7 ? TYPE[P.stag.seq[P.stag.i]] : pick(TYPES);
  const tm = tmpl(x), j = () => Math.random() - 0.5, n = performance.now();
  let dir = norm([tm.dir[0] + j() * 0.5, tm.dir[1] + j() * 0.5, tm.dir[2] + j() * 0.3]);
  if (P && P.stag && P.stag.kind === "shinobi") dir = norm([(P.stag.lastSign || 1) * -1, j() * 0.4, 0]);
  return {
    demo: true, peak: tm.peak * rand(0.55, 1.1), dir,
    amp: tm.amp * rand(0.55, 1.15), wob: tm.wob + rand(0, 0.25), dip: tm.dip + rand(0, 0.3), settle: rand(0.1, 0.9), tStart: n - 350, tEnd: n,
  };
}
function demoSwing() { audio(); lastDemoAt = performance.now(); onMeasure(demoMeasure()); }
$("btn-demo").onclick = demoSwing;
document.addEventListener("keydown", (e) => {
  if ($("scr-battle").hidden || stream || resultActions) return;
  if (e.code === "Space") { e.preventDefault(); demoSwing(); }
  if (/^Digit[12]$/.test(e.code)) switchWeapon(+e.code.slice(5) - 1);
});

// ---------- camera + pose ----------
const video = $("video"), cv = $("overlay"), ctx = cv.getContext("2d");
let stream = null, landmarker = null, running = false, lastVideoTime = -1, wakeLock = null;

async function startCamera() {
  const msg = $("cam-msg"); msg.hidden = false;
  audio();
  if (!navigator.mediaDevices?.getUserMedia) { msg.textContent = t("cam.unsupported"); return; }
  $("btn-cam").disabled = true; msg.textContent = t("cam.starting");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  } catch (e) {
    stream = null; $("btn-cam").disabled = false;
    msg.textContent = t("cam.denied", { err: e.name || "Error" });
    return;
  }
  video.srcObject = stream; await video.play();
  $("placeholder").hidden = true; $("btn-demo").hidden = true; $("atk-demo").hidden = true;
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  if (!landmarker) {
    msg.textContent = t("cam.loading");
    try {
      const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs");
      const files = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
      const opts = (delegate) => ({
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate },
        runningMode: "VIDEO", numPoses: 1,
      });
      try { landmarker = await vision.PoseLandmarker.createFromOptions(files, opts("GPU")); }
      catch { landmarker = await vision.PoseLandmarker.createFromOptions(files, opts("CPU")); }
    } catch (e) {
      msg.textContent = t("cam.modelFail");
      stopCamera(); return;
    }
  }
  msg.textContent = t("cam.ready");
  $("btn-cam").textContent = t("battle.camStop"); $("btn-cam").disabled = false;
  running = true; requestAnimationFrame(loop);
}
function stopCamera() {
  running = false;
  if (stream) stream.getTracks().forEach((tr) => tr.stop());
  stream = null; video.srcObject = null;
  try { wakeLock?.release(); } catch {} wakeLock = null;
  ctx.clearRect(0, 0, cv.width, cv.height);
  $("placeholder").hidden = false; $("btn-demo").hidden = false;
  $("btn-cam").textContent = t("battle.camStart"); $("btn-cam").disabled = false;
  $("pose-chip").textContent = t("chip.camOff"); $("pose-chip").className = "chip";
}
$("btn-cam").textContent = t("battle.camStart");
$("btn-cam").onclick = () => (stream ? stopCamera() : startCamera());

function loop() {
  if (!running) return;
  try {
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      const tt = performance.now();
      const res = landmarker.detectForVideo(video, tt);
      poseFrames++;
      if (cv.width !== video.videoWidth) { cv.width = video.videoWidth; cv.height = video.videoHeight; }
      ctx.clearRect(0, 0, cv.width, cv.height);
      const lm = res.landmarks && res.landmarks[0];
      if (lm) onPose(lm, res.worldLandmarks && res.worldLandmarks[0], tt); else { detector.lost(); gesture.update(tt, null); setChip(false); }
    }
  } catch (e) { console.error(e); } // one bad frame must not stop tracking
  requestAnimationFrame(loop);
}
function setChip(ok, txt) {
  const c = $("pose-chip");
  c.textContent = ok ? (txt || t("chip.tracking")) : t("chip.noBody"); c.className = "chip " + (ok ? "ok" : "ng");
}

let torsoPx = 0, kScale = 0, hand3 = null;
const trail = [];
function onPose(lm, wl, tt) {
  const W = cv.width, H = cv.height;
  const Pt = (i) => ({ x: lm[i].x * W, y: lm[i].y * H, v: lm[i].visibility ?? 1 });
  const nose = Pt(0), ls = Pt(11), rs = Pt(12), lh = Pt(23), rh = Pt(24), lw = Pt(15), rw = Pt(16), le = Pt(13), re = Pt(14);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const sm = mid(ls, rs), hm = mid(lh, rh), sw = Math.hypot(ls.x - rs.x, ls.y - rs.y);
  const hipsOk = lh.v > 0.4 && rh.v > 0.4;
  const T = Math.max(hipsOk ? Math.hypot(sm.x - hm.x, sm.y - hm.y) : 0, sw * 1.25);
  // freeze body scale while crouching for a dodge so the crouch itself doesn't shrink the yardstick
  if (!atk) torsoPx = torsoPx ? torsoPx * 0.9 + T * 0.1 : T;
  const vl = Math.max(0.05, lw.v), vr = Math.max(0.05, rw.v);
  const hand2 = { x: (lw.x * vl + rw.x * vr) / (vl + vr), y: (lw.y * vl + rw.y * vr) / (vl + vr) };
  hist2.push({ ...hand2, t: tt }); while (hist2.length && tt - hist2[0].t > 1800) hist2.shift();

  // skeleton + a short live trail (image space, mirrored by CSS)
  ctx.lineWidth = Math.max(2, W / 200); ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(235,229,213,.6)";
  [[ls, rs], [ls, le], [le, lw], [rs, re], [re, rw], [ls, lh], [rs, rh], [lh, rh]].forEach(([a, b]) => {
    if (a.v < 0.3 || b.v < 0.3) return; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
  trail.push({ ...hand2, t: tt }); while (trail.length && tt - trail[0].t > 300) trail.shift();
  ctx.strokeStyle = trailColor(); ctx.lineWidth = Math.max(4, W / 90);
  ctx.beginPath(); trail.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y))); ctx.stroke();

  const visible = (ls.v > 0.5 || rs.v > 0.5) && (lw.v > 0.3 || rw.v > 0.3);
  if (!visible) { gesture.update(tt, null); setChip(false); return; }

  // remote-command poses (image space; the raw camera frame shows the player's left wrist on the right)
  const T0 = torsoPx;
  const handsUp = lw.v > 0.5 && rw.v > 0.5 && lw.y < nose.y - 0.15 * T0 && rw.y < nose.y - 0.15 * T0;
  const crossed = lw.v > 0.4 && rw.v > 0.4 && lw.x < rw.x - 0.12 * T0 &&
    [lw, rw].every((p) => p.y > sm.y - 0.3 * T0 && p.y < sm.y + 0.9 * T0);
  const commanding = gesture.update(tt, handsUp ? "ok" : crossed ? "ng" : null);

  // 3D hand position in the player's frame, metres: [right, down, toward camera], hip-centred so steps and crouches don't count as cuts
  if (wl) {
    const W3 = (i) => wl[i];
    const m3 = (a, b) => [(a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2];
    const torsoW = len(sub(m3(W3(11), W3(12)), m3(W3(23), W3(24))));
    if (!atk && torsoW > 0.15) { const k = torsoMeters() / torsoW; kScale = kScale ? kScale * 0.95 + k * 0.05 : k; }
    const a = W3(15), b = W3(16), s = kScale || 1;
    const raw = [-((a.x * vl + b.x * vr) / (vl + vr)) * s, ((a.y * vl + b.y * vr) / (vl + vr)) * s, -((a.z * vl + b.z * vr) / (vl + vr)) * s];
    hand3 = hand3 ? [hand3[0] * 0.45 + raw[0] * 0.55, hand3[1] * 0.45 + raw[1] * 0.55, hand3[2] * 0.6 + raw[2] * 0.4] : raw; // depth is noisier
  }

  if (atk && !atk.done) {
    setChip(true, t("chip.dodging"));
    dodge.update({ t: gnow(), T: torsoPx, sm, hand: hand2, nose, wristGap: Math.hypot(lw.x - rw.x, lw.y - rw.y), speed: detector.speed });
  } else dodge.baseline(sm);
  // cuts are measured during enemy attacks too: they still land, and a sideways cut parries a guard attack.
  // World landmarks are centred on the hips, so stepping or crouching barely moves the hands here.
  if (hand3) detector.update(hand3, tt);
  if (!atk || atk.done) {
    if (!commanding) setChip(true, t(phase === "zanshin" ? "chip.zanshin" : detector.state === "idle" ? "chip.kamae" : "chip.cutting"));
    // stillness, for 居合 (a cut from stillness) and 残心
    if (detector.state === "idle") { if (detector.speed < B.bout.iaiStillSpeed) stillSince = stillSince || tt; else stillSince = 0; }
    zanshinFrame(detector.speed);
  }
}

// Dodge detector: compares the shoulders against a standing baseline captured just before the attack.
const dodge = {
  base: null, armed: null, guardSince: 0, last: null,
  baseline(sm) { this.base = this.base ? { x: this.base.x * 0.92 + sm.x * 0.08, y: this.base.y * 0.92 + sm.y * 0.08 } : { ...sm }; },
  arm() { this.armed = this.base ? { ...this.base } : null; this.guardSince = 0; this.last = null; },
  update({ t: tt, T, sm, hand, nose, wristGap, speed }) {
    if (!this.armed) { this.armed = { ...sm }; return; }
    const drop = (sm.y - this.armed.y) / T;
    // raw camera x grows toward the player's left, which is the screen's left in the mirrored view
    const shift = (sm.x - this.armed.x) / T;
    if (drop > 0.45) return tryDodge("crouch");
    if (shift > 0.6) return tryDodge("stepL");
    if (shift < -0.6) return tryDodge("stepR");
    // sword held upright in front of the face: hands together between chin and upper chest, held still
    const upright = hand.y < sm.y + 0.25 * T && hand.y > nose.y - 0.6 * T && wristGap < 0.7 * T && speed < 0.9;
    if (upright) { this.guardSince = this.guardSince || tt; if (tt - this.guardSince > 250) tryDodge("guard"); }
    else this.guardSince = 0;
  },
};

// Swing detector on the 3D hand path (m/s). It only measures; judge() decides whether it was a cut.
const START = 1.6, STOP = 0.6, ONSET = 0.45;
const detector = {
  state: "idle", prev: null, speed: 0, hist: [], s: null, cool: 0,
  lost() { this.prev = null; this.speed = 0; this.state = "idle"; },
  reset(p, tt) { this.state = "idle"; this.hist = []; this.prev = { p, t: tt }; this.speed = 0; this.cool = tt + 600; },
  update(p, tt) {
    if (this.prev) {
      const dt = (tt - this.prev.t) / 1000;
      if (dt > 0) this.speed = this.speed * 0.4 + (len(sub(p, this.prev.p)) / dt) * 0.6;
    }
    this.prev = { p, t: tt };
    this.hist.push({ p, t: tt, s: this.speed }); while (this.hist.length && tt - this.hist[0].t > 800) this.hist.shift();

    if (this.state === "idle") {
      if (this.speed > START && tt > this.cool) {
        let i = this.hist.length - 1;
        while (i > 0 && this.hist[i - 1].s > ONSET) i--;      // walk back to where the motion began
        const from = this.hist.slice(Math.max(0, i - 1));
        this.s = { tStart: from[0].t, start: from[0].p, pts: from.map((h) => h.p), speeds: from.map((h) => h.s), low: 0 };
        this.state = "swing";
      }
    } else if (this.state === "swing") {
      const s = this.s; s.pts.push(p); s.speeds.push(this.speed);
      if (this.speed < STOP) s.low = s.low || tt; else s.low = 0;
      if ((s.low && tt - s.low > 80) || tt - s.tStart > 1600) {
        s.end = p; s.tEnd = tt; s.settleSum = 0; s.settleN = 0;
        this.state = "settle";
      }
    } else if (this.state === "settle") {
      const s = this.s; s.settleSum += this.speed; s.settleN++;
      if (tt - s.tEnd > 280 || this.speed > START) this.finish();
    }
  },
  finish() {
    const s = this.s; this.state = "idle"; this.cool = performance.now() + 100;
    const ch = sub(s.end, s.start), amp = len(ch);
    if (amp < 0.18) return; // wrist flick, not a swing
    const dir = scl(ch, 1 / amp);
    let wob = 0;
    s.pts.forEach((q) => { const r = sub(q, s.start), along = dot(r, dir); wob = Math.max(wob, len(sub(r, scl(dir, along)))); });
    const peak = Math.max(...s.speeds), pi = s.speeds.indexOf(peak);
    let run = 0, dip = 0;
    for (let i = 0; i < pi; i++) { run = Math.max(run, s.speeds[i]); dip = Math.max(dip, (run - s.speeds[i]) / peak); }
    onMeasure({ peak, dir, amp, wob: wob / amp, dip, settle: s.settleN ? s.settleSum / s.settleN : 2, tStart: s.tStart, tEnd: s.tEnd });
  },
};

show("title");
</script>
